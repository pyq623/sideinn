<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title"><title id="title">BST查找与有序插入退化</title><rect width="100%" height="100%" rx="14" fill="#f0f5f0"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b35"><text x="280" y="38" text-anchor="middle" font-size="22" fill="#243b35" font-weight="600">按 4、2、6、1、3、5、7 插入</text><text x="750" y="38" text-anchor="middle" font-size="22" fill="#243b35" font-weight="600">按 1、2、3、4 插入</text><path d="M280,105 L150,190" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M280,105 L410,190" fill="none" stroke="#246b55" stroke-width="5"/><path d="M150,190 L85,275" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M150,190 L215,275" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M410,190 L345,275" fill="none" stroke="#246b55" stroke-width="5"/><path d="M410,190 L475,275" fill="none" stroke="#a2b2a8" stroke-width="3"/><circle cx="280" cy="105" r="25" fill="#246b55" stroke="#246b55" stroke-width="2"/><text x="280" y="111" text-anchor="middle" font-size="19" fill="#ffffff">4</text><circle cx="150" cy="190" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="150" y="196" text-anchor="middle" font-size="19" fill="#243b35">2</text><circle cx="410" cy="190" r="25" fill="#246b55" stroke="#246b55" stroke-width="2"/><text x="410" y="196" text-anchor="middle" font-size="19" fill="#ffffff">6</text><circle cx="85" cy="275" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="85" y="281" text-anchor="middle" font-size="19" fill="#243b35">1</text><circle cx="215" cy="275" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="215" y="281" text-anchor="middle" font-size="19" fill="#243b35">3</text><circle cx="345" cy="275" r="25" fill="#246b55" stroke="#246b55" stroke-width="2"/><text x="345" y="281" text-anchor="middle" font-size="19" fill="#ffffff">5</text><circle cx="475" cy="275" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="475" y="281" text-anchor="middle" font-size="19" fill="#243b35">7</text><text x="280" y="346" text-anchor="middle" font-size="20" fill="#246b55">查找 5：绿色路径 4 → 6 → 5</text><path d="M565,65 L565,350" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M650,95 L695,160" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M695,160 L740,225" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M740,225 L785,290" fill="none" stroke="#a2b2a8" stroke-width="3"/><circle cx="650" cy="95" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="650" y="101" text-anchor="middle" font-size="19" fill="#243b35">1</text><circle cx="695" cy="160" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="695" y="166" text-anchor="middle" font-size="19" fill="#243b35">2</text><circle cx="740" cy="225" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="740" y="231" text-anchor="middle" font-size="19" fill="#243b35">3</text><circle cx="785" cy="290" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="785" y="296" text-anchor="middle" font-size="19" fill="#243b35">4</text><text x="750" y="346" text-anchor="middle" font-size="18" fill="#243b35">仍是 BST，但查找 4 要走满整条链</text></g></svg>