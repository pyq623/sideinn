<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-label="白板题：先画四条责任边界"><rect width="100%" height="100%" fill="#f2f6ef"/><g font-family="-apple-system,PingFang SC,Arial,sans-serif" fill="#213c2e"><text x="410" y="36" text-anchor="middle" font-size="23" font-weight="600">白板题：先画四条责任边界</text><rect x="25" y="62" width="365" height="104" rx="8" fill="white" stroke="#8caa92"/><text x="43" y="93" font-size="20" font-weight="600">1. 执行边界</text><text x="43" y="128" font-size="16">Task → Scheduler → Sandbox</text><rect x="430" y="62" width="365" height="104" rx="8" fill="white" stroke="#8caa92"/><text x="448" y="93" font-size="20" font-weight="600">2. 数据边界</text><text x="448" y="128" font-size="16">Proxy → tokens / masks / versions</text><rect x="25" y="202" width="365" height="104" rx="8" fill="white" stroke="#8caa92"/><text x="43" y="233" font-size="20" font-weight="600">3. 学习边界</text><text x="43" y="268" font-size="16">Reward → Learner → weights</text><rect x="430" y="202" width="365" height="104" rx="8" fill="white" stroke="#8caa92"/><text x="448" y="233" font-size="20" font-weight="600">4. 验证边界</text><text x="448" y="268" font-size="16">独立Eval + Trace + 故障分类</text><text x="410" y="372" text-anchor="middle" font-size="15">逐边检查：谁写入、谁验证、失败由谁恢复。</text></g></svg>