<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-label="一条任务怎样进入训练"><rect width="100%" height="100%" fill="#f2f6ef"/><g font-family="-apple-system,PingFang SC,Arial,sans-serif" fill="#213c2e"><text x="410" y="36" text-anchor="middle" font-size="23" font-weight="600">一条任务怎样进入训练</text><rect x="25" y="62" width="365" height="104" rx="8" fill="white" stroke="#8caa92"/><text x="43" y="93" font-size="20" font-weight="600">1. 任务与沙箱</text><text x="43" y="128" font-size="16">固定初态、工具和验收规则</text><rect x="430" y="62" width="365" height="104" rx="8" fill="white" stroke="#8caa92"/><text x="448" y="93" font-size="20" font-weight="600">2. 策略 + Harness</text><text x="448" y="128" font-size="16">观察 → 生成动作 → 调用工具</text><rect x="25" y="202" width="365" height="104" rx="8" fill="white" stroke="#8caa92"/><text x="43" y="233" font-size="20" font-weight="600">3. 反馈与轨迹</text><text x="43" y="268" font-size="16">记录真实结果、token与概率</text><rect x="430" y="202" width="365" height="104" rx="8" fill="white" stroke="#8caa92"/><text x="448" y="233" font-size="20" font-weight="600">4. Learner + 发布</text><text x="448" y="268" font-size="16">更新参数，下一批使用新版本</text><text x="410" y="372" text-anchor="middle" font-size="15">先有可验证交互，再有参数学习；四步循环发生。</text></g></svg>