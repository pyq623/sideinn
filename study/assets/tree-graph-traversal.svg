<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title"><title id="title">BFS逐层发现ABCDE，DFS沿一条路深入ABDEC</title><rect width="100%" height="100%" rx="14" fill="#f0f5f0"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b35"><path d="M480,20 L480,460" fill="none" stroke="#a2b2a8" stroke-width="3"/><text x="240" y="38" text-anchor="middle" font-size="23" fill="#243b35" font-weight="600">BFS：先近后远</text><path d="M240,100 L125,210" fill="none" stroke="#246b55" stroke-width="5"/><path d="M240,100 L355,210" fill="none" stroke="#246b55" stroke-width="5"/><path d="M125,210 L125,330" fill="none" stroke="#246b55" stroke-width="5"/><path d="M355,210 L355,330" fill="none" stroke="#246b55" stroke-width="5"/><path d="M125,330 L355,330" fill="none" stroke="#a2b2a8" stroke-width="3"/><circle cx="240" cy="100" r="25" fill="#246b55" stroke="#246b55" stroke-width="2"/><text x="240" y="106" text-anchor="middle" font-size="19" fill="#ffffff">A</text><circle cx="125" cy="210" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="125" y="216" text-anchor="middle" font-size="19" fill="#243b35">B</text><circle cx="355" cy="210" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="355" y="216" text-anchor="middle" font-size="19" fill="#243b35">C</text><circle cx="125" cy="330" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="125" y="336" text-anchor="middle" font-size="19" fill="#243b35">D</text><circle cx="355" cy="330" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="355" y="336" text-anchor="middle" font-size="19" fill="#243b35">E</text><text x="240" y="66" text-anchor="middle" font-size="16" fill="#246b55">第1个</text><text x="125" y="176" text-anchor="middle" font-size="16" fill="#246b55">第2个</text><text x="355" y="176" text-anchor="middle" font-size="16" fill="#246b55">第3个</text><text x="83" y="336" text-anchor="end" font-size="16" fill="#246b55">第4个</text><text x="397" y="336" text-anchor="start" font-size="16" fill="#246b55">第5个</text><text x="240" y="400" text-anchor="middle" font-size="20" fill="#243b35" font-weight="600">发现顺序：A → B → C → D → E</text><text x="240" y="438" text-anchor="middle" font-size="17" fill="#246b55">距离分层：A ｜ B、C ｜ D、E</text><text x="720" y="38" text-anchor="middle" font-size="23" fill="#243b35" font-weight="600">DFS：先深入再回退</text><path d="M720,100 L605,210" fill="none" stroke="#246b55" stroke-width="5"/><path d="M720,100 L835,210" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M605,210 L605,330" fill="none" stroke="#246b55" stroke-width="5"/><path d="M835,210 L835,330" fill="none" stroke="#246b55" stroke-width="5"/><path d="M605,330 L835,330" fill="none" stroke="#246b55" stroke-width="5"/><circle cx="720" cy="100" r="25" fill="#246b55" stroke="#246b55" stroke-width="2"/><text x="720" y="106" text-anchor="middle" font-size="19" fill="#ffffff">A</text><circle cx="605" cy="210" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="605" y="216" text-anchor="middle" font-size="19" fill="#243b35">B</text><circle cx="835" cy="210" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="835" y="216" text-anchor="middle" font-size="19" fill="#243b35">C</text><circle cx="605" cy="330" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="605" y="336" text-anchor="middle" font-size="19" fill="#243b35">D</text><circle cx="835" cy="330" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="835" y="336" text-anchor="middle" font-size="19" fill="#243b35">E</text><text x="720" y="66" text-anchor="middle" font-size="16" fill="#246b55">第1个</text><text x="605" y="176" text-anchor="middle" font-size="16" fill="#246b55">第2个</text><text x="835" y="176" text-anchor="middle" font-size="16" fill="#246b55">第5个</text><text x="563" y="336" text-anchor="end" font-size="16" fill="#246b55">第3个</text><text x="877" y="336" text-anchor="start" font-size="16" fill="#246b55">第4个</text><text x="720" y="400" text-anchor="middle" font-size="20" fill="#243b35" font-weight="600">发现顺序：A → B → D → E → C</text><text x="720" y="438" text-anchor="middle" font-size="17" fill="#246b55">走到底后：C → E → D → B → A 回退</text><text x="480" y="490" text-anchor="middle" font-size="18" fill="#243b35">绿边 = 首次发现新顶点所走的边；灰边仍存在，只是不用于本次首次发现</text></g></svg>