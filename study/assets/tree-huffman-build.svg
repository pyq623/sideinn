<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title"><title id="title">哈夫曼树：合并2和3，再合并5和7，最后合并12和9</title><rect width="100%" height="100%" rx="14" fill="#f0f5f0"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b35"><path d="M320,20 L320,495" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M640,20 L640,495" fill="none" stroke="#a2b2a8" stroke-width="3"/><text x="160" y="36" text-anchor="middle" font-size="22" fill="#243b35" font-weight="600">① 2 + 3 = 5</text><text x="160" y="74" text-anchor="middle" font-size="18" fill="#246b55">候选：5、7、9</text><text x="480" y="36" text-anchor="middle" font-size="22" fill="#243b35" font-weight="600">② 5 + 7 = 12</text><text x="480" y="74" text-anchor="middle" font-size="18" fill="#246b55">候选：9、12</text><text x="800" y="36" text-anchor="middle" font-size="22" fill="#243b35" font-weight="600">③ 12 + 9 = 21</text><text x="800" y="74" text-anchor="middle" font-size="18" fill="#246b55">只剩根 21，构造完成</text><path d="M100,150 L60,245" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M100,150 L140,245" fill="none" stroke="#a2b2a8" stroke-width="3"/><circle cx="100" cy="150" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="100" y="156" text-anchor="middle" font-size="19" fill="#243b35">5</text><circle cx="60" cy="245" r="25" fill="#246b55" stroke="#246b55" stroke-width="2"/><text x="60" y="251" text-anchor="middle" font-size="19" fill="#ffffff">2</text><circle cx="140" cy="245" r="25" fill="#246b55" stroke="#246b55" stroke-width="2"/><text x="140" y="251" text-anchor="middle" font-size="19" fill="#ffffff">3</text><circle cx="220" cy="150" r="25" fill="#246b55" stroke="#246b55" stroke-width="2"/><text x="220" y="156" text-anchor="middle" font-size="19" fill="#ffffff">7</text><circle cx="280" cy="150" r="25" fill="#246b55" stroke="#246b55" stroke-width="2"/><text x="280" y="156" text-anchor="middle" font-size="19" fill="#ffffff">9</text><text x="160" y="450" text-anchor="middle" font-size="19" fill="#243b35">新增父节点 5</text><text x="160" y="480" text-anchor="middle" font-size="19" fill="#246b55">2、3 留在它下面</text><path d="M460,150 L410,250" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M460,150 L550,250" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M410,250 L370,350" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M410,250 L450,350" fill="none" stroke="#a2b2a8" stroke-width="3"/><circle cx="460" cy="150" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="460" y="156" text-anchor="middle" font-size="19" fill="#243b35">12</text><circle cx="410" cy="250" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="410" y="256" text-anchor="middle" font-size="19" fill="#243b35">5</text><circle cx="550" cy="250" r="25" fill="#246b55" stroke="#246b55" stroke-width="2"/><text x="550" y="256" text-anchor="middle" font-size="19" fill="#ffffff">7</text><circle cx="370" cy="350" r="25" fill="#246b55" stroke="#246b55" stroke-width="2"/><text x="370" y="356" text-anchor="middle" font-size="19" fill="#ffffff">2</text><circle cx="450" cy="350" r="25" fill="#246b55" stroke="#246b55" stroke-width="2"/><text x="450" y="356" text-anchor="middle" font-size="19" fill="#ffffff">3</text><circle cx="600" cy="150" r="25" fill="#246b55" stroke="#246b55" stroke-width="2"/><text x="600" y="156" text-anchor="middle" font-size="19" fill="#ffffff">9</text><text x="480" y="450" text-anchor="middle" font-size="19" fill="#243b35">整棵 5 子树与 7 合并</text><text x="480" y="480" text-anchor="middle" font-size="19" fill="#246b55">2、3 的路径又多 1 条边</text><path d="M810,130 L740,225" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M810,130 L900,225" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M740,225 L705,320" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M740,225 L805,320" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M705,320 L675,410" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M705,320 L735,410" fill="none" stroke="#a2b2a8" stroke-width="3"/><circle cx="810" cy="130" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="810" y="136" text-anchor="middle" font-size="19" fill="#243b35">21</text><circle cx="740" cy="225" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="740" y="231" text-anchor="middle" font-size="19" fill="#243b35">12</text><circle cx="900" cy="225" r="25" fill="#246b55" stroke="#246b55" stroke-width="2"/><text x="900" y="231" text-anchor="middle" font-size="19" fill="#ffffff">9</text><circle cx="705" cy="320" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="705" y="326" text-anchor="middle" font-size="19" fill="#243b35">5</text><circle cx="805" cy="320" r="25" fill="#246b55" stroke="#246b55" stroke-width="2"/><text x="805" y="326" text-anchor="middle" font-size="19" fill="#ffffff">7</text><circle cx="675" cy="410" r="25" fill="#246b55" stroke="#246b55" stroke-width="2"/><text x="675" y="416" text-anchor="middle" font-size="19" fill="#ffffff">2</text><circle cx="735" cy="410" r="25" fill="#246b55" stroke="#246b55" stroke-width="2"/><text x="735" y="416" text-anchor="middle" font-size="19" fill="#ffffff">3</text><text x="800" y="480" text-anchor="middle" font-size="19" fill="#246b55">9 最浅；2、3 最深</text><text x="480" y="523" text-anchor="middle" font-size="18" fill="#243b35">绿色 = 原始叶子权值     白色 = 合并得到的内部节点（孩子权值之和）</text></g></svg>