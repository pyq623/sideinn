<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title"><title id="title">BST删除根4并用后继5替换</title><rect width="100%" height="100%" rx="14" fill="#f0f5f0"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b35"><text x="230" y="38" text-anchor="middle" font-size="22" fill="#243b35" font-weight="600">删除前</text><path d="M230,100 L130,180" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M230,100 L330,180" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M130,180 L80,260" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M130,180 L180,260" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M330,180 L380,260" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M330,180 L280,260" fill="none" stroke="#a2b2a8" stroke-width="3"/><circle cx="230" cy="100" r="25" fill="#246b55" stroke="#246b55" stroke-width="2"/><text x="230" y="106" text-anchor="middle" font-size="19" fill="#ffffff">4</text><circle cx="130" cy="180" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="130" y="186" text-anchor="middle" font-size="19" fill="#243b35">2</text><circle cx="330" cy="180" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="330" y="186" text-anchor="middle" font-size="19" fill="#243b35">6</text><circle cx="80" cy="260" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="80" y="266" text-anchor="middle" font-size="19" fill="#243b35">1</text><circle cx="180" cy="260" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="180" y="266" text-anchor="middle" font-size="19" fill="#243b35">3</text><circle cx="380" cy="260" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="380" y="266" text-anchor="middle" font-size="19" fill="#243b35">7</text><circle cx="280" cy="260" r="25" fill="#246b55" stroke="#246b55" stroke-width="2"/><text x="280" y="266" text-anchor="middle" font-size="19" fill="#ffffff">5</text><text x="230" y="316" text-anchor="middle" font-size="18" fill="#243b35">后继是右子树最小值 5</text><text x="730" y="38" text-anchor="middle" font-size="22" fill="#243b35" font-weight="600">删除后</text><path d="M730,100 L630,180" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M730,100 L830,180" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M630,180 L580,260" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M630,180 L680,260" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M830,180 L880,260" fill="none" stroke="#a2b2a8" stroke-width="3"/><circle cx="730" cy="100" r="25" fill="#246b55" stroke="#246b55" stroke-width="2"/><text x="730" y="106" text-anchor="middle" font-size="19" fill="#ffffff">5</text><circle cx="630" cy="180" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="630" y="186" text-anchor="middle" font-size="19" fill="#243b35">2</text><circle cx="830" cy="180" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="830" y="186" text-anchor="middle" font-size="19" fill="#243b35">6</text><circle cx="580" cy="260" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="580" y="266" text-anchor="middle" font-size="19" fill="#243b35">1</text><circle cx="680" cy="260" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="680" y="266" text-anchor="middle" font-size="19" fill="#243b35">3</text><circle cx="880" cy="260" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="880" y="266" text-anchor="middle" font-size="19" fill="#243b35">7</text><text x="730" y="316" text-anchor="middle" font-size="18" fill="#243b35">原来 6 左边的 5 已移除</text><text x="480" y="150" text-anchor="middle" font-size="34" fill="#246b55">→</text><text x="480" y="179" text-anchor="middle" font-size="17" fill="#246b55">后继替换</text></g></svg>