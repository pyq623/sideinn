<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-label="沙箱池的复用状态机"><rect width="100%" height="100%" fill="#f2f6ef"/><g font-family="-apple-system,PingFang SC,Arial,sans-serif" fill="#213c2e"><text x="410" y="36" text-anchor="middle" font-size="23" font-weight="600">沙箱池的复用状态机</text><rect x="25" y="62" width="365" height="104" rx="8" fill="white" stroke="#8caa92"/><text x="43" y="93" font-size="20" font-weight="600">1. Ready → Leased</text><text x="43" y="128" font-size="16">分配独立任务身份与租约</text><rect x="430" y="62" width="365" height="104" rx="8" fill="white" stroke="#8caa92"/><text x="448" y="93" font-size="20" font-weight="600">2. Running → Finalized</text><text x="448" y="128" font-size="16">执行、终止、封存结果与产物</text><rect x="25" y="202" width="365" height="104" rx="8" fill="white" stroke="#8caa92"/><text x="43" y="233" font-size="20" font-weight="600">3. Resetting → Verified</text><text x="43" y="268" font-size="16">清理可变状态并验证初态</text><rect x="430" y="202" width="365" height="104" rx="8" fill="white" stroke="#8caa92"/><text x="448" y="233" font-size="20" font-weight="600">4. Ready 或 Quarantined</text><text x="448" y="268" font-size="16">验证成功再复用；失败先隔离</text><text x="410" y="372" text-anchor="middle" font-size="15">租约失效、清理失败、平台错误均需显式分支。</text></g></svg>