<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-label="异步系统：两条并行执行线"><rect width="100%" height="100%" fill="#f2f6ef"/><g font-family="-apple-system,PingFang SC,Arial,sans-serif" fill="#213c2e"><text x="410" y="36" text-anchor="middle" font-size="23" font-weight="600">异步系统：两条并行执行线</text><rect x="25" y="62" width="365" height="104" rx="8" fill="white" stroke="#8caa92"/><text x="43" y="93" font-size="20" font-weight="600">1. Rollout线持续交互</text><text x="43" y="128" font-size="16">采样 → 工具 → 结果 → 轨迹</text><rect x="430" y="62" width="365" height="104" rx="8" fill="white" stroke="#8caa92"/><text x="448" y="93" font-size="20" font-weight="600">2. 有界队列连接两线</text><text x="448" y="128" font-size="16">记录年龄、版本、有效率</text><rect x="25" y="202" width="365" height="104" rx="8" fill="white" stroke="#8caa92"/><text x="43" y="233" font-size="20" font-weight="600">3. Learner线凑批更新</text><text x="43" y="268" font-size="16">消费轨迹 → 训练 → 新权重</text><rect x="430" y="202" width="365" height="104" rx="8" fill="white" stroke="#8caa92"/><text x="448" y="233" font-size="20" font-weight="600">4. 版本发布回到采样线</text><text x="448" y="268" font-size="16">校验切换与恢复，不混淆来源</text><text x="410" y="372" text-anchor="middle" font-size="15">Rollout与Learner重叠执行；背压和版本证据控制偏差。</text></g></svg>