<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title"><title id="title">原图、错误的最便宜三条边与正确最小生成树</title><rect width="100%" height="100%" rx="14" fill="#f0f5f0"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b35"><path d="M320,20 L320,400" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M640,20 L640,400" fill="none" stroke="#a2b2a8" stroke-width="3"/><text x="160" y="36" text-anchor="middle" font-size="20" fill="#243b35" font-weight="600">原图：可选的 5 条线路</text><text x="480" y="36" text-anchor="middle" font-size="20" fill="#243b35" font-weight="600">错误：只选最便宜 3 条</text><text x="800" y="36" text-anchor="middle" font-size="20" fill="#243b35" font-weight="600">MST：连通全部点且无环</text><path d="M160,110 L60,210" fill="none" stroke="#a2b2a8" stroke-width="2"/><path d="M160,110 L260,210" fill="none" stroke="#a2b2a8" stroke-width="2"/><path d="M60,210 L260,210" fill="none" stroke="#a2b2a8" stroke-width="2"/><path d="M60,210 L160,310" fill="none" stroke="#a2b2a8" stroke-width="2"/><path d="M260,210 L160,310" fill="none" stroke="#a2b2a8" stroke-width="2"/><circle cx="160" cy="110" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="160" y="116" text-anchor="middle" font-size="19" fill="#243b35">A</text><circle cx="60" cy="210" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="60" y="216" text-anchor="middle" font-size="19" fill="#243b35">B</text><circle cx="260" cy="210" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="260" y="216" text-anchor="middle" font-size="19" fill="#243b35">C</text><circle cx="160" cy="310" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="160" y="316" text-anchor="middle" font-size="19" fill="#243b35">D</text><text x="95" y="150" text-anchor="middle" font-size="21" fill="#64746d" font-weight="600">1</text><text x="225" y="150" text-anchor="middle" font-size="21" fill="#64746d" font-weight="600">2</text><text x="160" y="196" text-anchor="middle" font-size="21" fill="#64746d" font-weight="600">3</text><text x="95" y="280" text-anchor="middle" font-size="21" fill="#64746d" font-weight="600">4</text><text x="225" y="280" text-anchor="middle" font-size="21" fill="#64746d" font-weight="600">5</text><path d="M480,110 L380,210" fill="none" stroke="#246b55" stroke-width="5"/><path d="M480,110 L580,210" fill="none" stroke="#246b55" stroke-width="5"/><path d="M380,210 L580,210" fill="none" stroke="#b34347" stroke-width="5"/><path d="M380,210 L480,310" fill="none" stroke="#a2b2a8" stroke-width="2"/><path d="M580,210 L480,310" fill="none" stroke="#a2b2a8" stroke-width="2"/><circle cx="480" cy="110" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="480" y="116" text-anchor="middle" font-size="19" fill="#243b35">A</text><circle cx="380" cy="210" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="380" y="216" text-anchor="middle" font-size="19" fill="#243b35">B</text><circle cx="580" cy="210" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="580" y="216" text-anchor="middle" font-size="19" fill="#243b35">C</text><circle cx="480" cy="310" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="480" y="316" text-anchor="middle" font-size="19" fill="#243b35">D</text><text x="415" y="150" text-anchor="middle" font-size="21" fill="#246b55" font-weight="600">1</text><text x="545" y="150" text-anchor="middle" font-size="21" fill="#246b55" font-weight="600">2</text><text x="480" y="196" text-anchor="middle" font-size="21" fill="#b34347" font-weight="600">3</text><text x="415" y="280" text-anchor="middle" font-size="21" fill="#64746d" font-weight="600">4</text><text x="545" y="280" text-anchor="middle" font-size="21" fill="#64746d" font-weight="600">5</text><path d="M800,110 L700,210" fill="none" stroke="#246b55" stroke-width="5"/><path d="M800,110 L900,210" fill="none" stroke="#246b55" stroke-width="5"/><path d="M700,210 L900,210" fill="none" stroke="#a2b2a8" stroke-width="2"/><path d="M700,210 L800,310" fill="none" stroke="#246b55" stroke-width="5"/><path d="M900,210 L800,310" fill="none" stroke="#a2b2a8" stroke-width="2"/><circle cx="800" cy="110" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="800" y="116" text-anchor="middle" font-size="19" fill="#243b35">A</text><circle cx="700" cy="210" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="700" y="216" text-anchor="middle" font-size="19" fill="#243b35">B</text><circle cx="900" cy="210" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="900" y="216" text-anchor="middle" font-size="19" fill="#243b35">C</text><circle cx="800" cy="310" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="800" y="316" text-anchor="middle" font-size="19" fill="#243b35">D</text><text x="735" y="150" text-anchor="middle" font-size="21" fill="#246b55" font-weight="600">1</text><text x="865" y="150" text-anchor="middle" font-size="21" fill="#246b55" font-weight="600">2</text><text x="800" y="196" text-anchor="middle" font-size="21" fill="#64746d" font-weight="600">3</text><text x="735" y="280" text-anchor="middle" font-size="21" fill="#246b55" font-weight="600">4</text><text x="865" y="280" text-anchor="middle" font-size="21" fill="#64746d" font-weight="600">5</text><text x="160" y="375" text-anchor="middle" font-size="19" fill="#246b55">数字 = 铺线费用</text><text x="480" y="375" text-anchor="middle" font-size="19" fill="#b34347">ABC 成环，D 仍然孤立</text><text x="800" y="375" text-anchor="middle" font-size="19" fill="#246b55">总费用 1 + 2 + 4 = 7</text><text x="480" y="425" text-anchor="middle" font-size="18" fill="#243b35">灰边 = 未选线路；绿边 = 选中线路；红边 = 会闭合成环的线路</text></g></svg>