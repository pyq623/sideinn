<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title"><title id="title">红黑树插入30与继续插5的修复对比</title><rect width="100%" height="100%" rx="14" fill="#f0f5f0"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b35"><text x="480" y="38" text-anchor="middle" font-size="22" fill="#243b35" font-weight="600">例 1：插入 30 后父红、叔黑 → 旋转并变色</text><path d="M140,105 L185,170" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M185,170 L230,235" fill="none" stroke="#a2b2a8" stroke-width="3"/><circle cx="140" cy="105" r="25" fill="#243b35" stroke="#243b35" stroke-width="2"/><text x="140" y="111" text-anchor="middle" font-size="19" fill="#ffffff">10 B</text><circle cx="185" cy="170" r="25" fill="#b34347" stroke="#b34347" stroke-width="2"/><text x="185" y="176" text-anchor="middle" font-size="19" fill="#ffffff">20 R</text><circle cx="230" cy="235" r="25" fill="#b34347" stroke="#b34347" stroke-width="2"/><text x="230" y="241" text-anchor="middle" font-size="19" fill="#ffffff">30 R</text><text x="470" y="165" text-anchor="middle" font-size="34" fill="#246b55">→</text><text x="470" y="194" text-anchor="middle" font-size="17" fill="#246b55">左旋 10 ＋ 变色</text><path d="M755,105 L690,180" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M755,105 L820,180" fill="none" stroke="#a2b2a8" stroke-width="3"/><circle cx="755" cy="105" r="25" fill="#243b35" stroke="#243b35" stroke-width="2"/><text x="755" y="111" text-anchor="middle" font-size="19" fill="#ffffff">20 B</text><circle cx="690" cy="180" r="25" fill="#b34347" stroke="#b34347" stroke-width="2"/><text x="690" y="186" text-anchor="middle" font-size="19" fill="#ffffff">10 R</text><circle cx="820" cy="180" r="25" fill="#b34347" stroke="#b34347" stroke-width="2"/><text x="820" y="186" text-anchor="middle" font-size="19" fill="#ffffff">30 R</text><text x="480" y="295" text-anchor="middle" font-size="19" fill="#243b35">左图是待修复状态：20 R 与 30 R 连红；右图恢复合法</text><path d="M30,320 L930,320" fill="none" stroke="#a2b2a8" stroke-width="3"/><text x="480" y="360" text-anchor="middle" font-size="22" fill="#243b35" font-weight="600">例 2：在右上结果中再插 5，父红、叔红 → 变色</text><path d="M220,430 L140,510" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M220,430 L300,510" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M140,510 L85,590" fill="none" stroke="#a2b2a8" stroke-width="3"/><circle cx="220" cy="430" r="25" fill="#243b35" stroke="#243b35" stroke-width="2"/><text x="220" y="436" text-anchor="middle" font-size="19" fill="#ffffff">20 B</text><circle cx="140" cy="510" r="25" fill="#b34347" stroke="#b34347" stroke-width="2"/><text x="140" y="516" text-anchor="middle" font-size="19" fill="#ffffff">10 R</text><circle cx="300" cy="510" r="25" fill="#b34347" stroke="#b34347" stroke-width="2"/><text x="300" y="516" text-anchor="middle" font-size="19" fill="#ffffff">30 R</text><circle cx="85" cy="590" r="25" fill="#b34347" stroke="#b34347" stroke-width="2"/><text x="85" y="596" text-anchor="middle" font-size="19" fill="#ffffff">5 R</text><path d="M745,430 L665,510" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M745,430 L825,510" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M665,510 L610,590" fill="none" stroke="#a2b2a8" stroke-width="3"/><circle cx="745" cy="430" r="25" fill="#243b35" stroke="#243b35" stroke-width="2"/><text x="745" y="436" text-anchor="middle" font-size="19" fill="#ffffff">20 B</text><circle cx="665" cy="510" r="25" fill="#243b35" stroke="#243b35" stroke-width="2"/><text x="665" y="516" text-anchor="middle" font-size="19" fill="#ffffff">10 B</text><circle cx="825" cy="510" r="25" fill="#243b35" stroke="#243b35" stroke-width="2"/><text x="825" y="516" text-anchor="middle" font-size="19" fill="#ffffff">30 B</text><circle cx="610" cy="590" r="25" fill="#b34347" stroke="#b34347" stroke-width="2"/><text x="610" y="596" text-anchor="middle" font-size="19" fill="#ffffff">5 R</text><text x="480" y="505" text-anchor="middle" font-size="34" fill="#246b55">→</text><text x="480" y="534" text-anchor="middle" font-size="17" fill="#246b55">父、叔变黑</text><text x="480" y="650" text-anchor="middle" font-size="19" fill="#243b35">祖父 20 先变红；因它是根，最后再变黑。图中省略的 NIL 均为黑。</text></g></svg>