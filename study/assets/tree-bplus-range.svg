<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title"><title id="title">B加树内部导航键与有序叶子链，查找范围8至42</title><rect width="100%" height="100%" rx="14" fill="#f0f5f0"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b35"><text x="480" y="36" text-anchor="middle" font-size="23" fill="#243b35" font-weight="600">B+ 树：先向下定位，再沿叶子链扫描</text><path d="M480,112 L180,265" fill="none" stroke="#246b55" stroke-width="4"/><path d="M480,112 L480,265" fill="none" stroke="#a2b2a8" stroke-width="2"/><path d="M480,112 L780,265" fill="none" stroke="#a2b2a8" stroke-width="2"/><rect x="428.0" y="89" width="104" height="46" rx="6" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="454.0" y="119" text-anchor="middle" font-size="21" fill="#243b35">20</text><path d="M480.0,89 L480.0,135" fill="none" stroke="#9bbbad" stroke-width="1"/><text x="506.0" y="119" text-anchor="middle" font-size="21" fill="#243b35">40</text><text x="480" y="72" text-anchor="middle" font-size="17" fill="#243b35">内部层：只导航</text><rect x="95" y="191" width="170" height="28" fill="#f0f5f0"/><text x="180" y="211" text-anchor="middle" font-size="18" fill="#243b35">键 &lt; 20</text><rect x="395" y="191" width="170" height="28" fill="#f0f5f0"/><text x="480" y="211" text-anchor="middle" font-size="18" fill="#243b35">20 ≤ 键 &lt; 40</text><rect x="695" y="191" width="170" height="28" fill="#f0f5f0"/><text x="780" y="211" text-anchor="middle" font-size="18" fill="#243b35">键 ≥ 40</text><rect x="128.0" y="242" width="104" height="46" rx="6" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="154.0" y="272" text-anchor="middle" font-size="21" fill="#243b35">5</text><path d="M180.0,242 L180.0,288" fill="none" stroke="#9bbbad" stroke-width="1"/><text x="206.0" y="272" text-anchor="middle" font-size="21" fill="#243b35">10</text><rect x="428.0" y="242" width="104" height="46" rx="6" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="454.0" y="272" text-anchor="middle" font-size="21" fill="#243b35">20</text><path d="M480.0,242 L480.0,288" fill="none" stroke="#9bbbad" stroke-width="1"/><text x="506.0" y="272" text-anchor="middle" font-size="21" fill="#243b35">30</text><rect x="728.0" y="242" width="104" height="46" rx="6" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="754.0" y="272" text-anchor="middle" font-size="21" fill="#243b35">40</text><path d="M780.0,242 L780.0,288" fill="none" stroke="#9bbbad" stroke-width="1"/><text x="806.0" y="272" text-anchor="middle" font-size="21" fill="#243b35">50</text><text x="330" y="274" text-anchor="middle" font-size="38" fill="#246b55">→</text><text x="630" y="274" text-anchor="middle" font-size="38" fill="#246b55">→</text><text x="180" y="322" text-anchor="middle" font-size="18" fill="#246b55">跳过 5，从 10 开始</text><text x="480" y="322" text-anchor="middle" font-size="18" fill="#246b55">继续取 20、30</text><text x="780" y="322" text-anchor="middle" font-size="18" fill="#246b55">取 40，遇 50 停止</text><text x="480" y="369" text-anchor="middle" font-size="19" fill="#243b35" font-weight="600">叶层：保存全部记录项，20、40 的记录仍在这里</text><text x="480" y="402" text-anchor="middle" font-size="17" fill="#243b35">查询 8 ≤ key ≤ 42，结果：10、20、30、40（图中省略每个键对应的记录内容）</text></g></svg>