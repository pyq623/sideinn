<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title"><title id="title">同一张无向图：AB、AC、BD、CE、DE，共5点5边</title><rect width="100%" height="100%" rx="14" fill="#f0f5f0"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b35"><text x="240" y="38" text-anchor="middle" font-size="22" fill="#243b35" font-weight="600">5 个顶点，5 条无向边</text><path d="M240,100 L125,210" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M240,100 L355,210" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M125,210 L125,330" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M355,210 L355,330" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M125,330 L355,330" fill="none" stroke="#a2b2a8" stroke-width="3"/><circle cx="240" cy="100" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="240" y="106" text-anchor="middle" font-size="19" fill="#243b35">A</text><circle cx="125" cy="210" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="125" y="216" text-anchor="middle" font-size="19" fill="#243b35">B</text><circle cx="355" cy="210" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="355" y="216" text-anchor="middle" font-size="19" fill="#243b35">C</text><circle cx="125" cy="330" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="125" y="336" text-anchor="middle" font-size="19" fill="#243b35">D</text><circle cx="355" cy="330" r="25" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="355" y="336" text-anchor="middle" font-size="19" fill="#243b35">E</text><text x="240" y="410" text-anchor="middle" font-size="19" fill="#246b55">连线没有箭头，可以双向走</text><text x="710" y="95" text-anchor="middle" font-size="23" fill="#243b35" font-weight="600">度 = 接在该点身上的边数</text><text x="710" y="145" text-anchor="middle" font-size="20" fill="#243b35">A：AB、AC → 度 2</text><text x="710" y="188" text-anchor="middle" font-size="20" fill="#243b35">B：AB、BD → 度 2</text><text x="710" y="231" text-anchor="middle" font-size="20" fill="#243b35">C：AC、CE → 度 2</text><text x="710" y="274" text-anchor="middle" font-size="20" fill="#243b35">D：BD、DE → 度 2</text><text x="710" y="317" text-anchor="middle" font-size="20" fill="#243b35">E：CE、DE → 度 2</text><text x="710" y="405" text-anchor="middle" font-size="22" fill="#246b55">度数和 10 = 2 × 边数 5</text></g></svg>