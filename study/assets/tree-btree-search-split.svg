<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title"><title id="title">B树查找30与4阶B树插入40时的根分裂</title><rect width="100%" height="100%" rx="14" fill="#f0f5f0"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b35"><text x="480" y="37" text-anchor="middle" font-size="23" fill="#243b35" font-weight="600">① 多个键划分区间：查 30 走中间分支</text><path d="M480,100 L190,210" fill="none" stroke="#a2b2a8" stroke-width="4"/><path d="M480,100 L480,210" fill="none" stroke="#246b55" stroke-width="4"/><path d="M480,100 L770,210" fill="none" stroke="#a2b2a8" stroke-width="4"/><rect x="428.0" y="77" width="104" height="46" rx="6" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="454.0" y="107" text-anchor="middle" font-size="21" fill="#243b35">20</text><path d="M480.0,77 L480.0,123" fill="none" stroke="#9bbbad" stroke-width="1"/><text x="506.0" y="107" text-anchor="middle" font-size="21" fill="#243b35">40</text><rect x="138.0" y="187" width="104" height="46" rx="6" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="164.0" y="217" text-anchor="middle" font-size="21" fill="#243b35">5</text><path d="M190.0,187 L190.0,233" fill="none" stroke="#9bbbad" stroke-width="1"/><text x="216.0" y="217" text-anchor="middle" font-size="21" fill="#243b35">10</text><rect x="428.0" y="187" width="104" height="46" rx="6" fill="#246b55" stroke="#246b55" stroke-width="2"/><text x="454.0" y="217" text-anchor="middle" font-size="21" fill="#ffffff">25</text><path d="M480.0,187 L480.0,233" fill="none" stroke="#9bbbad" stroke-width="1"/><text x="506.0" y="217" text-anchor="middle" font-size="21" fill="#ffffff">30</text><rect x="718.0" y="187" width="104" height="46" rx="6" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="744.0" y="217" text-anchor="middle" font-size="21" fill="#243b35">45</text><path d="M770.0,187 L770.0,233" fill="none" stroke="#9bbbad" stroke-width="1"/><text x="796.0" y="217" text-anchor="middle" font-size="21" fill="#243b35">50</text><rect x="105" y="148" width="170" height="28" fill="#f0f5f0"/><text x="190" y="168" text-anchor="middle" font-size="18" fill="#243b35">键 &lt; 20</text><rect x="395" y="148" width="170" height="28" fill="#f0f5f0"/><text x="480" y="168" text-anchor="middle" font-size="18" fill="#243b35">20 &lt; 键 &lt; 40</text><rect x="685" y="148" width="170" height="28" fill="#f0f5f0"/><text x="770" y="168" text-anchor="middle" font-size="18" fill="#243b35">键 &gt; 40</text><text x="480" y="264" text-anchor="middle" font-size="18" fill="#246b55">查 20 可在根直接结束；每个矩形是一整个节点</text><path d="M25,288 L935,288" fill="none" stroke="#a2b2a8" stroke-width="3"/><text x="480" y="326" text-anchor="middle" font-size="22" fill="#243b35" font-weight="600">② 4 阶树：最多 3 个键，插 40 前先分裂满根</text><rect x="132.0" y="397" width="156" height="46" rx="6" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="158.0" y="427" text-anchor="middle" font-size="21" fill="#243b35">10</text><path d="M184.0,397 L184.0,443" fill="none" stroke="#9bbbad" stroke-width="1"/><text x="210.0" y="427" text-anchor="middle" font-size="21" fill="#243b35">20</text><path d="M236.0,397 L236.0,443" fill="none" stroke="#9bbbad" stroke-width="1"/><text x="262.0" y="427" text-anchor="middle" font-size="21" fill="#243b35">30</text><text x="210" y="480" text-anchor="middle" font-size="18" fill="#243b35">原根已满</text><text x="440" y="413" text-anchor="middle" font-size="34" fill="#246b55">→</text><text x="440" y="442" text-anchor="middle" font-size="17" fill="#246b55">20 上移</text><path d="M720,390 L620,485" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M720,390 L820,485" fill="none" stroke="#246b55" stroke-width="4"/><rect x="694.0" y="367" width="52" height="46" rx="6" fill="#246b55" stroke="#246b55" stroke-width="2"/><text x="720.0" y="397" text-anchor="middle" font-size="21" fill="#ffffff">20</text><rect x="594.0" y="462" width="52" height="46" rx="6" fill="#ffffff" stroke="#246b55" stroke-width="2"/><text x="620.0" y="492" text-anchor="middle" font-size="21" fill="#243b35">10</text><rect x="768.0" y="462" width="104" height="46" rx="6" fill="#246b55" stroke="#246b55" stroke-width="2"/><text x="794.0" y="492" text-anchor="middle" font-size="21" fill="#ffffff">30</text><path d="M820.0,462 L820.0,508" fill="none" stroke="#9bbbad" stroke-width="1"/><text x="846.0" y="492" text-anchor="middle" font-size="21" fill="#ffffff">40</text><text x="720" y="545" text-anchor="middle" font-size="18" fill="#246b55">新根为 20；40 插入右叶</text><text x="480" y="580" text-anchor="middle" font-size="16" fill="#243b35">这里只画键；传统 B-tree 的内部键也关联记录或记录指针</text></g></svg>