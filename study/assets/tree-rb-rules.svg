<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title"><title id="title">红黑树颜色与NIL黑高的合法例子</title><rect width="100%" height="100%" rx="14" fill="#f0f5f0"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b35"><text x="480" y="35" text-anchor="middle" font-size="22" fill="#243b35" font-weight="600">B = 黑色，R = 红色；NIL 表示空孩子</text><path d="M300,90 L180,175" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M300,90 L420,175" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M180,175 L105,260" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M180,175 L245,260" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M420,175 L365,260" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M420,175 L475,260" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M105,260 L60,345" fill="none" stroke="#a2b2a8" stroke-width="3"/><path d="M105,260 L150,345" fill="none" stroke="#a2b2a8" stroke-width="3"/><circle cx="300" cy="90" r="25" fill="#243b35" stroke="#243b35" stroke-width="2"/><text x="300" y="96" text-anchor="middle" font-size="19" fill="#ffffff">20 B</text><circle cx="180" cy="175" r="25" fill="#243b35" stroke="#243b35" stroke-width="2"/><text x="180" y="181" text-anchor="middle" font-size="19" fill="#ffffff">10 B</text><circle cx="420" cy="175" r="25" fill="#243b35" stroke="#243b35" stroke-width="2"/><text x="420" y="181" text-anchor="middle" font-size="19" fill="#ffffff">30 B</text><circle cx="105" cy="260" r="25" fill="#b34347" stroke="#b34347" stroke-width="2"/><text x="105" y="266" text-anchor="middle" font-size="19" fill="#ffffff">5 R</text><rect x="224" y="248" width="42" height="24" rx="4" fill="#243b35"/><text x="245" y="266" text-anchor="middle" font-size="14" fill="#ffffff">NIL</text><rect x="344" y="248" width="42" height="24" rx="4" fill="#243b35"/><text x="365" y="266" text-anchor="middle" font-size="14" fill="#ffffff">NIL</text><rect x="454" y="248" width="42" height="24" rx="4" fill="#243b35"/><text x="475" y="266" text-anchor="middle" font-size="14" fill="#ffffff">NIL</text><rect x="39" y="333" width="42" height="24" rx="4" fill="#243b35"/><text x="60" y="351" text-anchor="middle" font-size="14" fill="#ffffff">NIL</text><rect x="129" y="333" width="42" height="24" rx="4" fill="#243b35"/><text x="150" y="351" text-anchor="middle" font-size="14" fill="#ffffff">NIL</text><text x="720" y="135" text-anchor="middle" font-size="20" fill="#243b35" font-weight="600">不计根 20，计末端 NIL</text><text x="720" y="185" text-anchor="middle" font-size="19" fill="#243b35">10 B → 5 R → NIL：2 个黑</text><text x="720" y="230" text-anchor="middle" font-size="19" fill="#243b35">10 B → NIL：2 个黑</text><text x="720" y="275" text-anchor="middle" font-size="19" fill="#243b35">30 B → NIL：2 个黑</text><text x="720" y="330" text-anchor="middle" font-size="20" fill="#246b55">数据叶子 5 为红，也合法</text></g></svg>