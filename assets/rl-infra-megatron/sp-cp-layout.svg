<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840" role="img"><title>SP 和 CP 的序列布局</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#234e43"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#234e43"><text x="500" y="35" font-size="26" font-weight="700" text-anchor="middle">SP：同一 TP 组内，在 MLP 边界改变布局</text><rect x="15" y="65" width="170" height="98" rx="10" fill="#e6f3e9" stroke="#b9cec5" stroke-width="1.5"/><text x="100.0" y="106.3" font-size="20" font-weight="400" text-anchor="middle">序列行分片</text><text x="100.0" y="135.3" font-size="20" font-weight="400" text-anchor="middle">每卡 [N/2,H]</text><rect x="215" y="65" width="170" height="98" rx="10" fill="#e9effc" stroke="#b9cec5" stroke-width="1.5"/><text x="300.0" y="106.3" font-size="20" font-weight="400" text-anchor="middle">all-gather X</text><text x="300.0" y="135.3" font-size="20" font-weight="400" text-anchor="middle">各卡 [N,H]</text><rect x="415" y="65" width="170" height="98" rx="10" fill="#e6f3e9" stroke="#b9cec5" stroke-width="1.5"/><text x="500.0" y="106.3" font-size="20" font-weight="400" text-anchor="middle">列并行 + 激活</text><text x="500.0" y="135.3" font-size="20" font-weight="400" text-anchor="middle">Yᵢ [N,F/2]</text><rect x="615" y="65" width="170" height="98" rx="10" fill="#fff1cc" stroke="#b9cec5" stroke-width="1.5"/><text x="700.0" y="106.3" font-size="20" font-weight="400" text-anchor="middle">行并行</text><text x="700.0" y="135.3" font-size="20" font-weight="400" text-anchor="middle">Zᵢ [N,H]</text><rect x="815" y="65" width="170" height="98" rx="10" fill="#e6f3e9" stroke="#b9cec5" stroke-width="1.5"/><text x="900.0" y="106.3" font-size="20" font-weight="400" text-anchor="middle">reduce-scatter</text><text x="900.0" y="135.3" font-size="20" font-weight="400" text-anchor="middle">每卡 [N/2,H]</text><path d="M185 114 L210 114" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><path d="M385 114 L410 114" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><path d="M585 114 L610 114" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><path d="M785 114 L810 114" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="201" font-size="22" font-weight="700" text-anchor="middle">前向：收集不同位置 → 算不同特征 → 求和并分回位置</text><rect x="25" y="222" width="950" height="82" rx="10" fill="#f5f7f5" stroke="#b9cec5" stroke-width="1.5"/><text x="500.0" y="255.14" font-size="21" font-weight="400" text-anchor="middle">反向：出口梯度 all-gather → 本地反向 → 输入梯度 reduce-scatter</text><text x="500.0" y="285.14" font-size="21" font-weight="400" text-anchor="middle">计算 A 的权重梯度时，若只保存了分片 X，还需重新收集 X</text><path d="M20 325 L980 325" stroke="#cbd9d0" stroke-width="2"/><text x="500" y="366" font-size="26" font-weight="700" text-anchor="middle">CP：每卡负责本地 query，仍需其他位置的 KV</text><text x="500" y="398" font-size="21" font-weight="400" text-anchor="middle">教学配置 CP=2、TP=1；序列 1–4；因果掩码</text><rect x="35" y="423" width="410" height="95" rx="10" fill="#e6f3e9" stroke="#b9cec5" stroke-width="1.5"/><text x="240.0" y="462.48" font-size="22" font-weight="400" text-anchor="middle">CP rank 0：位置 1、2</text><text x="240.0" y="493.48" font-size="22" font-weight="400" text-anchor="middle">本地 Q₁₂、K₁₂、V₁₂</text><rect x="555" y="423" width="410" height="95" rx="10" fill="#e6f3e9" stroke="#b9cec5" stroke-width="1.5"/><text x="760.0" y="462.48" font-size="22" font-weight="400" text-anchor="middle">CP rank 1：位置 3、4</text><text x="760.0" y="493.48" font-size="22" font-weight="400" text-anchor="middle">本地 Q₃₄、K₃₄、V₃₄</text><path d="M240 518 L360 546" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><path d="M760 518 L640 546" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><rect x="185" y="550" width="630" height="65" rx="10" fill="#e9effc" stroke="#b9cec5" stroke-width="1.5"/><text x="500.0" y="590.32" font-size="23" font-weight="400" text-anchor="middle">all-gather：两边获得位置 1–4 的 KV</text><path d="M360 615 L240 643" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 615 L760 643" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="648" width="410" height="79" rx="10" fill="#e6f3e9" stroke="#b9cec5" stroke-width="1.5"/><text x="240.0" y="679.48" font-size="22" font-weight="400" text-anchor="middle">q₁ 读 1；q₂ 读 1、2</text><text x="240.0" y="710.48" font-size="22" font-weight="400" text-anchor="middle">只输出位置 1、2 的结果</text><rect x="555" y="648" width="410" height="79" rx="10" fill="#e6f3e9" stroke="#b9cec5" stroke-width="1.5"/><text x="760.0" y="679.48" font-size="22" font-weight="400" text-anchor="middle">q₃ 读 1–3；q₄ 读 1–4</text><text x="760.0" y="710.48" font-size="22" font-weight="400" text-anchor="middle">只输出位置 3、4 的结果</text><rect x="35" y="749" width="930" height="65" rx="10" fill="#fff1cc" stroke="#b9cec5" stroke-width="1.5"/><text x="500.0" y="788.98" font-size="22" font-weight="400" text-anchor="middle">反向：KV 梯度贡献先相加，再按位置归回 0 / 1（reduce-scatter）</text></g></svg>