<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img"><title>MoE 路由、分发及返回</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#234e43"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#234e43"><text x="500" y="34" font-size="26" font-weight="700" text-anchor="middle">EP=2，ETP=1：4 个专家，每个 token 选 2 个</text><text x="150" y="77" font-size="23" font-weight="700" text-anchor="middle">① 原位置与路由</text><text x="500" y="77" font-size="23" font-weight="700" text-anchor="middle">② 专家所在地</text><text x="850" y="77" font-size="23" font-weight="700" text-anchor="middle">③ 返回并加权</text><rect x="20" y="115" width="260" height="145" rx="10" fill="#e9effc" stroke="#b9cec5" stroke-width="1.5"/><text x="150.0" y="163.32" font-size="23" font-weight="400" text-anchor="middle">rank 0：x_a</text><text x="150.0" y="195.32" font-size="23" font-weight="400" text-anchor="middle">E0：0.6</text><text x="150.0" y="227.32" font-size="23" font-weight="400" text-anchor="middle">E2：0.4</text><rect x="20" y="310" width="260" height="145" rx="10" fill="#e9effc" stroke="#b9cec5" stroke-width="1.5"/><text x="150.0" y="358.32" font-size="23" font-weight="400" text-anchor="middle">rank 1：x_b</text><text x="150.0" y="390.32" font-size="23" font-weight="400" text-anchor="middle">E1：0.3</text><text x="150.0" y="422.32" font-size="23" font-weight="400" text-anchor="middle">E2：0.7</text><rect x="370" y="115" width="260" height="145" rx="10" fill="#e6f3e9" stroke="#b9cec5" stroke-width="1.5"/><text x="500.0" y="163.32" font-size="23" font-weight="400" text-anchor="middle">rank 0</text><text x="500.0" y="195.32" font-size="23" font-weight="400" text-anchor="middle">E0 计算 a</text><text x="500.0" y="227.32" font-size="23" font-weight="400" text-anchor="middle">E1 计算 b</text><rect x="370" y="310" width="260" height="145" rx="10" fill="#e6f3e9" stroke="#b9cec5" stroke-width="1.5"/><text x="500.0" y="358.32" font-size="23" font-weight="400" text-anchor="middle">rank 1</text><text x="500.0" y="390.32" font-size="23" font-weight="400" text-anchor="middle">E2 计算 a、b</text><text x="500.0" y="422.32" font-size="23" font-weight="400" text-anchor="middle">E3 本例空闲</text><rect x="720" y="115" width="260" height="145" rx="10" fill="#fff1cc" stroke="#b9cec5" stroke-width="1.5"/><text x="850.0" y="163.98" font-size="22" font-weight="400" text-anchor="middle">回到 rank 0</text><text x="850.0" y="194.98" font-size="22" font-weight="400" text-anchor="middle">o_a = 0.6 E0(x_a)</text><text x="850.0" y="225.98" font-size="22" font-weight="400" text-anchor="middle">+ 0.4 E2(x_a)</text><rect x="720" y="310" width="260" height="145" rx="10" fill="#fff1cc" stroke="#b9cec5" stroke-width="1.5"/><text x="850.0" y="358.98" font-size="22" font-weight="400" text-anchor="middle">回到 rank 1</text><text x="850.0" y="389.98" font-size="22" font-weight="400" text-anchor="middle">o_b = 0.3 E1(x_b)</text><text x="850.0" y="420.98" font-size="22" font-weight="400" text-anchor="middle">+ 0.7 E2(x_b)</text><path d="M280 155 L365 155" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><path d="M280 225 L365 345" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><path d="M280 345 L365 225" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><path d="M280 415 L365 415" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><path d="M630 155 L715 155" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><path d="M630 225 L715 345" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><path d="M630 345 L715 225" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><path d="M630 415 L715 415" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="493" font-size="23" font-weight="700" text-anchor="middle">dispatch：按专家重新分布；combine：恢复 token 原位置</text><text x="500" y="526" font-size="20" font-weight="400" text-anchor="middle">箭头表示分支依赖；本地分支不必经过网络，专家参数留在原地</text></g></svg>