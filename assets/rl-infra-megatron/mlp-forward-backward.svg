<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img"><title>两层 MLP 的 TP 前反向</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#234e43"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#234e43"><text x="500" y="34" font-size="26" font-weight="700" text-anchor="middle">前向：不同特征分片 → 同一输出的部分和</text><text x="53" y="117" font-size="21" font-weight="700" text-anchor="middle">卡 0</text><rect x="95" y="85" width="130" height="75" rx="10" fill="#e9effc" stroke="#b9cec5" stroke-width="1.5"/><text x="160.0" y="114.48" font-size="22" font-weight="400" text-anchor="middle">X</text><text x="160.0" y="145.48" font-size="22" font-weight="400" text-anchor="middle">[N,H]</text><path d="M225 123 L255 123" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="85" width="195" height="75" rx="10" fill="#e6f3e9" stroke="#b9cec5" stroke-width="1.5"/><text x="357.5" y="114.48" font-size="22" font-weight="400" text-anchor="middle">× A0 → φ</text><text x="357.5" y="145.48" font-size="22" font-weight="400" text-anchor="middle">Y0 [N,F/2]</text><path d="M455 123 L485 123" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="85" width="205" height="75" rx="10" fill="#fff1cc" stroke="#b9cec5" stroke-width="1.5"/><text x="592.5" y="114.48" font-size="22" font-weight="400" text-anchor="middle">× B0</text><text x="592.5" y="145.48" font-size="22" font-weight="400" text-anchor="middle">Z0 [N,H]</text><path d="M695 123 L745 186" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><text x="53" y="244" font-size="21" font-weight="700" text-anchor="middle">卡 1</text><rect x="95" y="212" width="130" height="75" rx="10" fill="#e9effc" stroke="#b9cec5" stroke-width="1.5"/><text x="160.0" y="241.48" font-size="22" font-weight="400" text-anchor="middle">X</text><text x="160.0" y="272.48" font-size="22" font-weight="400" text-anchor="middle">[N,H]</text><path d="M225 250 L255 250" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="212" width="195" height="75" rx="10" fill="#e6f3e9" stroke="#b9cec5" stroke-width="1.5"/><text x="357.5" y="241.48" font-size="22" font-weight="400" text-anchor="middle">× A1 → φ</text><text x="357.5" y="272.48" font-size="22" font-weight="400" text-anchor="middle">Y1 [N,F/2]</text><path d="M455 250 L485 250" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="212" width="205" height="75" rx="10" fill="#fff1cc" stroke="#b9cec5" stroke-width="1.5"/><text x="592.5" y="241.48" font-size="22" font-weight="400" text-anchor="middle">× B1</text><text x="592.5" y="272.48" font-size="22" font-weight="400" text-anchor="middle">Z1 [N,H]</text><path d="M695 250 L745 186" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><rect x="750" y="145" width="230" height="83" rx="10" fill="#e9effc" stroke="#b9cec5" stroke-width="1.5"/><text x="865.0" y="178.32" font-size="23" font-weight="400" text-anchor="middle">all-reduce 求和</text><text x="865.0" y="210.32" font-size="23" font-weight="400" text-anchor="middle">Z = Z₀ + Z₁</text><text x="500" y="332" font-size="23" font-weight="700" text-anchor="middle">两卡各得到完整 Z；Y₀ 与 Y₁ 无须先拼接</text><path d="M20 356 L980 356" stroke="#cbd9d0" stroke-width="2"/><text x="500" y="395" font-size="26" font-weight="700" text-anchor="middle">反向：本地求导 → 汇总两条输入梯度贡献</text><text x="53" y="472" font-size="21" font-weight="700" text-anchor="middle">卡 0</text><rect x="95" y="442" width="130" height="75" rx="10" fill="#e9effc" stroke="#b9cec5" stroke-width="1.5"/><text x="160.0" y="471.8" font-size="20" font-weight="400" text-anchor="middle">G = ∂L/∂Z</text><text x="160.0" y="500.8" font-size="20" font-weight="400" text-anchor="middle">[N,H]</text><path d="M225 480 L255 480" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="442" width="195" height="75" rx="10" fill="#e6f3e9" stroke="#b9cec5" stroke-width="1.5"/><text x="357.5" y="471.48" font-size="22" font-weight="400" text-anchor="middle">G B0ᵀ → × φ′</text><text x="357.5" y="502.48" font-size="22" font-weight="400" text-anchor="middle">D0 [N,F/2]</text><path d="M455 480 L485 480" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="442" width="205" height="75" rx="10" fill="#fff1cc" stroke="#b9cec5" stroke-width="1.5"/><text x="592.5" y="471.64" font-size="21" font-weight="400" text-anchor="middle">V0 = D0 A0ᵀ</text><text x="592.5" y="501.64" font-size="21" font-weight="400" text-anchor="middle">[N,H] 部分梯度</text><path d="M695 480 L745 540" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><text x="53" y="598" font-size="21" font-weight="700" text-anchor="middle">卡 1</text><rect x="95" y="568" width="130" height="75" rx="10" fill="#e9effc" stroke="#b9cec5" stroke-width="1.5"/><text x="160.0" y="597.8" font-size="20" font-weight="400" text-anchor="middle">G = ∂L/∂Z</text><text x="160.0" y="626.8" font-size="20" font-weight="400" text-anchor="middle">[N,H]</text><path d="M225 606 L255 606" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="568" width="195" height="75" rx="10" fill="#e6f3e9" stroke="#b9cec5" stroke-width="1.5"/><text x="357.5" y="597.48" font-size="22" font-weight="400" text-anchor="middle">G B1ᵀ → × φ′</text><text x="357.5" y="628.48" font-size="22" font-weight="400" text-anchor="middle">D1 [N,F/2]</text><path d="M455 606 L485 606" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="568" width="205" height="75" rx="10" fill="#fff1cc" stroke="#b9cec5" stroke-width="1.5"/><text x="592.5" y="597.64" font-size="21" font-weight="400" text-anchor="middle">V1 = D1 A1ᵀ</text><text x="592.5" y="627.64" font-size="21" font-weight="400" text-anchor="middle">[N,H] 部分梯度</text><path d="M695 606 L745 540" fill="none" stroke="#234e43" stroke-width="2" marker-end="url(#arrow)"/><rect x="750" y="501" width="230" height="83" rx="10" fill="#e9effc" stroke="#b9cec5" stroke-width="1.5"/><text x="865.0" y="534.64" font-size="21" font-weight="400" text-anchor="middle">all-reduce 求和</text><text x="865.0" y="564.64" font-size="21" font-weight="400" text-anchor="middle">∂L/∂X = V₀ + V₁</text><text x="500" y="697" font-size="23" font-weight="700" text-anchor="middle">每卡还局部计算：∂L/∂Bᵢ = YᵢᵀG；∂L/∂Aᵢ = XᵀDᵢ</text><text x="500" y="735" font-size="20" font-weight="400" text-anchor="middle">不启用 SP；G 是同一逻辑损失的梯度，不重复累加两份损失</text></g></svg>