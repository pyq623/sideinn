<svg xmlns="http://www.w3.org/2000/svg" width="920" height="639" viewBox="0 0 920 639" role="img" aria-label="找到第一处分叉，而不是追着最终误差跑"><rect width="920" height="639" fill="#faf8f1"/><g font-family="system-ui, sans-serif" fill="#243f34"><text x="34" y="46" font-size="28" font-weight="700">找到第一处分叉，而不是追着最终误差跑</text><text x="34" y="79" font-size="17">先验证比较对象，再逐步缩小执行差异的范围。</text><rect x="34" y="108" width="852" height="88" rx="9" fill="#e5ede5"/><text x="58" y="140" font-size="22" font-weight="650">1 · 语义与版本</text><text x="58" y="171" font-size="18">token / shift / mask → sampling config → 权重与 scale → cache 来源</text><path d="M460 197v22m-6-6 6 6 6-6" fill="none" stroke="#b28c50" stroke-width="3"/><rect x="34" y="224" width="852" height="88" rx="9" fill="#f2e8d4"/><text x="58" y="256" font-size="22" font-weight="650">2 · 单引擎控制变量</text><text x="58" y="287" font-size="18">重复执行 → 换 batch 邻居 → prefill / decode → graph / eager</text><path d="M460 313v22m-6-6 6 6 6-6" fill="none" stroke="#b28c50" stroke-width="3"/><rect x="34" y="340" width="852" height="88" rx="9" fill="#e5ede5"/><text x="58" y="372" font-size="22" font-weight="650">3 · 跨引擎逐层定位</text><text x="58" y="403" font-size="18">找到首个异常层 → 固定同一层输入 → 对比 route、codes、算子输出</text><path d="M460 429v22m-6-6 6 6 6-6" fill="none" stroke="#b28c50" stroke-width="3"/><rect x="34" y="456" width="852" height="88" rx="9" fill="#f2e8d4"/><text x="58" y="488" font-size="22" font-weight="650">4 · 分开验收</text><text x="58" y="519" font-size="18">数值 → surrogate gradient → 学习质量 → 各阶段与端到端成本</text><text x="34" y="617" font-size="16">本图为排障建议；不是任何引擎已经实现的统一接口。</text></g></svg>