<svg xmlns="http://www.w3.org/2000/svg" width="920" height="523" viewBox="0 0 920 523" role="img" aria-label="先标出概率来源，再写 loss"><rect width="920" height="523" fill="#faf8f1"/><g font-family="system-ui, sans-serif" fill="#243f34"><text x="34" y="46" font-size="28" font-weight="700">先标出概率来源，再写 loss</text><text x="34" y="79" font-size="17">固定 token 与 prefix；示意以 old trainer + PPO + TIS 分支为例。</text><rect x="34" y="108" width="852" height="88" rx="9" fill="#e5ede5"/><text x="58" y="140" font-size="22" font-weight="650">① 行为分布 q：真正抽出 token</text><text x="58" y="171" font-size="18">采样引擎 + 权重版本 v + kernel / cache + sampling transforms</text><path d="M460 197v22m-6-6 6 6 6-6" fill="none" stroke="#b28c50" stroke-width="3"/><rect x="34" y="224" width="852" height="88" rx="9" fill="#f2e8d4"/><text x="58" y="256" font-size="22" font-weight="650">② 参考分布 p₀：更新前冻结的 trainer</text><text x="58" y="287" font-size="18">行为校正 ρ = p₀ / q；同权重也可能 ρ ≠ 1</text><path d="M460 313v22m-6-6 6 6 6-6" fill="none" stroke="#b28c50" stroke-width="3"/><rect x="34" y="340" width="852" height="88" rx="9" fill="#e5ede5"/><text x="58" y="372" font-size="22" font-weight="650">③ 当前分布 pθ：参与反向传播的 trainer</text><text x="58" y="403" font-size="18">更新比例 r = pθ / p₀；PPO clipping 与行为校正是两条不同路径</text><text x="34" y="501" font-size="16">比较相同语义的概率；raw logprob 不自动等于实际采样 logprob。</text></g></svg>