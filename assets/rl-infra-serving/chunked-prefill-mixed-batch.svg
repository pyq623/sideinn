<text x="221" y="282" text-anchor="middle" font-size="18" font-weight="bold">decode · 处理 1 个 token</text>
<text x="221" y="306" text-anchor="middle" font-size="16" font-weight="normal">读取自身 KV，采样下一个</text>
<rect x="355" y="63" width="222" height="97" rx="7" fill="#fbe5cf" stroke="#9bada2"/>
<text x="466" y="88" text-anchor="middle" font-size="22" font-weight="bold">prefill 第二块</text>
<text x="466" y="118" text-anchor="middle" font-size="20" font-weight="normal">处理 p₃、p₄</text>
<text x="466" y="144" text-anchor="middle" font-size="16" font-weight="normal">完成 prompt，采样 a₁</text>
