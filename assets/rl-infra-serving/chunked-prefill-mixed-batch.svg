<text x="466" y="282" text-anchor="middle" font-size="18" font-weight="bold">decode · 处理 1 个 token</text>
<text x="466" y="306" text-anchor="middle" font-size="16" font-weight="normal">读取自身 KV，采样下一个</text>
<rect x="600" y="63" width="222" height="97" rx="7" fill="#dcecf7" stroke="#9bada2"/>
