<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img"><title>Pull 与 push：改变准备顺序，数据方向均为 P 到 D</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#254e44"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#254e44">
<rect x="20" y="10" width="465" height="515" rx="14" fill="#f6faf7" stroke="#aac3b7"/>
<text x="252" y="48" text-anchor="middle" font-size="23" font-weight="600">Pull：P 完成后，D 再准备</text>
<rect x="515" y="10" width="465" height="515" rx="14" fill="#f6faf7" stroke="#aac3b7"/>
<text x="747" y="48" text-anchor="middle" font-size="23" font-weight="600">Push：D 提前准备，与 P 重叠</text>
<rect x="90" y="80" width="320" height="60" rx="10" fill="#e8f3ed" stroke="#aac3b7" stroke-width="1.5"/>
<text x="250.0" y="117.0" text-anchor="middle" font-size="21" font-weight="400">P 计算 prompt</text>
<path d="M250,140 L250,175" fill="none" stroke="#254e44" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="90" y="175" width="320" height="60" rx="10" fill="#eaf0fc" stroke="#aac3b7" stroke-width="1.5"/>
<text x="250.0" y="212.0" text-anchor="middle" font-size="20" font-weight="400">P 完成，代理转交源信息</text>
<path d="M250,235 L250,270" fill="none" stroke="#254e44" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="90" y="270" width="320" height="60" rx="10" fill="#fff0ce" stroke="#aac3b7" stroke-width="1.5"/>
<text x="250.0" y="307.0" text-anchor="middle" font-size="21" font-weight="400">D 分配目标，准备传输</text>
<path d="M250,330 L250,365" fill="none" stroke="#254e44" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="90" y="365" width="320" height="60" rx="10" fill="#eaf0fc" stroke="#aac3b7" stroke-width="1.5"/>
<text x="250.0" y="402.0" text-anchor="middle" font-size="19" font-weight="400">D 提交 READ：读取 P 的状态</text>
<path d="M250,425 L250,455" fill="none" stroke="#254e44" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="90" y="455" width="320" height="48" rx="10" fill="#e8f3ed" stroke="#aac3b7" stroke-width="1.5"/>
<text x="250.0" y="486.0" text-anchor="middle" font-size="20" font-weight="400">接收完成后，等待 D 执行</text>
<rect x="540" y="80" width="195" height="90" rx="10" fill="#e8f3ed" stroke="#aac3b7" stroke-width="1.5"/>
<text x="637.5" y="118.0" text-anchor="middle" font-size="20" font-weight="400">P 计算 prompt</text>
<text x="637.5" y="146.0" text-anchor="middle" font-size="20" font-weight="400">准备源数据</text>
<rect x="755" y="80" width="200" height="90" rx="10" fill="#fff0ce" stroke="#aac3b7" stroke-width="1.5"/>
<text x="855.0" y="118.0" text-anchor="middle" font-size="20" font-weight="400">D 分配目标</text>
<text x="855.0" y="146.0" text-anchor="middle" font-size="20" font-weight="400">向 P 登记位置</text>
<path d="M637,170 L637,205" fill="none" stroke="#254e44" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M855,170 L855,205" fill="none" stroke="#254e44" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M637,205 H855" stroke="#254e44" stroke-width="2" fill="none"/>
<path d="M746,205 L746,270" fill="none" stroke="#254e44" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="746" y="238" text-anchor="middle" font-size="19" font-weight="400">等两者都就绪</text>
<rect x="575" y="270" width="345" height="60" rx="10" fill="#fff0ce" stroke="#aac3b7" stroke-width="1.5"/>
<text x="747.5" y="307.0" text-anchor="middle" font-size="20" font-weight="400">P 后台线程：握手、准备提交</text>
<path d="M746,330 L746,365" fill="none" stroke="#254e44" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="575" y="365" width="345" height="60" rx="10" fill="#eaf0fc" stroke="#aac3b7" stroke-width="1.5"/>
<text x="747.5" y="402.0" text-anchor="middle" font-size="19" font-weight="400">P 提交 WRITE：写入 D 的空间</text>
<path d="M746,425 L746,455" fill="none" stroke="#254e44" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="575" y="455" width="345" height="48" rx="10" fill="#e8f3ed" stroke="#aac3b7" stroke-width="1.5"/>
<text x="747.5" y="486.0" text-anchor="middle" font-size="20" font-weight="400">接收完成后，等待 D 执行</text>
<text x="500" y="557" text-anchor="middle" font-size="22" font-weight="600">两边都传 P → D；提前的是目标准备，不是省掉数据搬运。</text>
</g></svg>