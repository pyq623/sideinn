<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img"><title>一次 push 交接：代理、P、传输、D 四泳道</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#254e44"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#254e44">
<rect x="30" y="16" width="200" height="52" rx="10" fill="#eaf0fc" stroke="#aac3b7" stroke-width="1.5"/>
<text x="130.0" y="49.0" text-anchor="middle" font-size="24" font-weight="400">代理</text>
<path d="M130,76 V775" stroke="#aac3b7" stroke-dasharray="5 6"/>
<rect x="270" y="16" width="200" height="52" rx="10" fill="#eaf0fc" stroke="#aac3b7" stroke-width="1.5"/>
<text x="370.0" y="49.0" text-anchor="middle" font-size="24" font-weight="400">P：prefill</text>
<path d="M370,76 V775" stroke="#aac3b7" stroke-dasharray="5 6"/>
<rect x="510" y="16" width="200" height="52" rx="10" fill="#eaf0fc" stroke="#aac3b7" stroke-width="1.5"/>
<text x="610.0" y="49.0" text-anchor="middle" font-size="24" font-weight="400">传输过程</text>
<path d="M610,76 V775" stroke="#aac3b7" stroke-dasharray="5 6"/>
<rect x="750" y="16" width="200" height="52" rx="10" fill="#eaf0fc" stroke="#aac3b7" stroke-width="1.5"/>
<text x="850.0" y="49.0" text-anchor="middle" font-size="24" font-weight="400">D：decode</text>
<path d="M850,76 V775" stroke="#aac3b7" stroke-dasharray="5 6"/>
<text x="28" y="105" text-anchor="start" font-size="17" font-weight="400">时间 ↓</text>
<path d="M130,112 L370,112" fill="none" stroke="#254e44" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="250" y="98" text-anchor="middle" font-size="19" font-weight="400">请求到达，提交 P</text>
<path d="M130,158 L850,158" fill="none" stroke="#254e44" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="610" y="144" text-anchor="middle" font-size="19" font-weight="400">同时提交 D，关联同一请求</text>
<rect x="270" y="185" width="200" height="72" rx="10" fill="#e8f3ed" stroke="#aac3b7" stroke-width="1.5"/>
<text x="370.0" y="214.0" text-anchor="middle" font-size="21" font-weight="400">P 排队</text>
<text x="370.0" y="242.0" text-anchor="middle" font-size="21" font-weight="400">计算 prompt</text>
<rect x="750" y="185" width="200" height="72" rx="10" fill="#e8f3ed" stroke="#aac3b7" stroke-width="1.5"/>
<text x="850.0" y="214.0" text-anchor="middle" font-size="21" font-weight="400">D 排队</text>
<text x="850.0" y="242.0" text-anchor="middle" font-size="21" font-weight="400">分配目标空间</text>
<path d="M850,285 L610,285" fill="none" stroke="#254e44" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="735" y="274" text-anchor="middle" font-size="19" font-weight="400">发布目标登记</text>
<rect x="270" y="300" width="200" height="48" rx="10" fill="#e8f3ed" stroke="#aac3b7" stroke-width="1.5"/>
<text x="370.0" y="331.0" text-anchor="middle" font-size="21" font-weight="400">源数据就绪</text>
<path d="M470,328 L610,328" fill="none" stroke="#254e44" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="555" y="313" text-anchor="middle" font-size="17" font-weight="400">交出待发块</text>
<rect x="500" y="365" width="220" height="86" rx="10" fill="#fff0ce" stroke="#aac3b7" stroke-width="1.5"/>
<text x="610.0" y="387.0" text-anchor="middle" font-size="20" font-weight="400">匹配源与目标</text>
<text x="610.0" y="415.0" text-anchor="middle" font-size="20" font-weight="400">建立／复用连接</text>
<text x="610.0" y="443.0" text-anchor="middle" font-size="20" font-weight="400">准备并提交 WRITE</text>
<rect x="270" y="385" width="200" height="60" rx="10" fill="#fff0ce" stroke="#aac3b7" stroke-width="1.5"/>
<text x="370.0" y="422.0" text-anchor="middle" font-size="20" font-weight="400">源块继续保留</text>
<path d="M610,482 L850,482" fill="none" stroke="#254e44" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="739" y="469" text-anchor="middle" font-size="19" font-weight="400">搬运数据：P → D</text>
<rect x="750" y="515" width="200" height="76" rx="10" fill="#e8f3ed" stroke="#aac3b7" stroke-width="1.5"/>
<text x="850.0" y="546.0" text-anchor="middle" font-size="20" font-weight="400">所需数据传完</text>
<text x="850.0" y="574.0" text-anchor="middle" font-size="20" font-weight="400">确认接收完成</text>
<path d="M610,615 L370,615" fill="none" stroke="#254e44" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="485" y="603" text-anchor="middle" font-size="18" font-weight="400">P 观察发送完成</text>
<rect x="270" y="640" width="200" height="48" rx="10" fill="#fff0ce" stroke="#aac3b7" stroke-width="1.5"/>
<text x="370.0" y="671.0" text-anchor="middle" font-size="20" font-weight="400">解除源块保留</text>
<rect x="750" y="620" width="200" height="68" rx="10" fill="#e8f3ed" stroke="#aac3b7" stroke-width="1.5"/>
<text x="850.0" y="647.0" text-anchor="middle" font-size="20" font-weight="400">调度器观察完成</text>
<text x="850.0" y="675.0" text-anchor="middle" font-size="20" font-weight="400">等待调度 → 执行</text>
<path d="M850,730 L130,730" fill="none" stroke="#254e44" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="490" y="716" text-anchor="middle" font-size="20" font-weight="400">D 的输出返回代理（不是转发 P 的响应）</text>
<rect x="30" y="760" width="200" height="58" rx="10" fill="#eaf0fc" stroke="#aac3b7" stroke-width="1.5"/>
<text x="130.0" y="796.0" text-anchor="middle" font-size="20" font-weight="400">转发至客户端</text>
<text x="620" y="805" text-anchor="middle" font-size="18" font-weight="400">解除源块保留与 D 执行可独立推进</text>
</g></svg>