<svg xmlns="http://www.w3.org/2000/svg" width="560" height="690" viewBox="0 0 560 690" role="img" aria-labelledby="title desc"><title id="title">AdaVDR 学习路径</title><desc id="desc">任务与证据经过轨迹检查及模型能力筛选，形成 SFT 示范，再通过 NASA-GRPO 学习工具动作的证据贡献与必要性。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#638f80"/></marker></defs><rect width="560" height="690" rx="20" fill="#f4f6ef"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="22" y="28" width="516" height="132" rx="14" fill="white" stroke="#cbd9ce"/><text x="46" y="63" font-size="23" font-weight="700" fill="#285c50">01  任务与证据</text><text x="46" y="100" font-size="20" fill="#35473d">视频线索 + 外部事实</text><text x="46" y="131" font-size="18" fill="#647469">明确需要回答的问题</text><path d="M280 164 V183" stroke="#638f80" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="190" width="516" height="132" rx="14" fill="white" stroke="#cbd9ce"/><text x="46" y="225" font-size="23" font-weight="700" fill="#285c50">02  轨迹检查与筛选</text><text x="46" y="262" font-size="20" fill="#35473d">执行、核验、必要时修正</text><text x="46" y="293" font-size="18" fill="#647469">结合模型能力筛掉可绕过调用</text><path d="M280 326 V345" stroke="#638f80" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="352" width="516" height="132" rx="14" fill="white" stroke="#cbd9ce"/><text x="46" y="387" font-size="23" font-weight="700" fill="#285c50">03  SFT 冷启动</text><text x="46" y="424" font-size="20" fill="#35473d">从经过验证的轨迹学习</text><text x="46" y="455" font-size="18" fill="#647469">选择工具与按需纠错</text><path d="M280 488 V507" stroke="#638f80" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="514" width="516" height="132" rx="14" fill="white" stroke="#cbd9ce"/><text x="46" y="549" font-size="23" font-weight="700" fill="#285c50">04  NASA-GRPO</text><text x="46" y="586" font-size="20" fill="#35473d">结果反馈 + 局部过程反馈</text><text x="46" y="617" font-size="18" fill="#647469">证据贡献 × 工具必要性</text><text 