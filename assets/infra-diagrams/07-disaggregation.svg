<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc"><title id="title">Prefill / Decode 分离</title><desc id="desc">图为一种简化路径；实际系统可流水传输、缓存命中或采用不同并行度。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2c756b"/></marker></defs><rect width="1100" height="420" rx="10" fill="#fffdf5"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="38" y="49" font-size="28" fill="#23464a" text-anchor="start" font-weight="650">Prefill / Decode 分离</text><rect x="35" y="118" width="200" height="126" rx="14" fill="#e2eee5" stroke="#9bbbac" stroke-width="2"/><text x="135.0" y="157" font-size="26" fill="#23464a" text-anchor="middle" font-weight="650">网关</text><text x="135.0" y="193" font-size="21" fill="#607b71" text-anchor="middle" font-weight="400">路由与排队</text><text x="135.0" y="224" font-size="21" fill="#607b71" text-anchor="middle" font-weight="400">上下文/版本一致</text><path d="M242 178 L297 178" stroke="#2c756b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="309" y="118" width="215" height="126" rx="14" fill="#e2eee5" stroke="#9bbbac" stroke-width="2"/><text x="416.5" y="157" font-size="26" fill="#23464a" text-anchor="middle" font-weight="650">P Worker</text><text x="416.5" y="193" font-size="21" fill="#607b71" text-anchor="middle" font-weight="400">处理输入</text><text x="416.5" y="224" font-size="21" fill="#607b71" text-anchor="middle" font-weight="400">生成 KV</text><path d="M532 178 L597 178" stroke="#2c756b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="610" y="118" width="200" height="126" rx="14" fill="#f9e7b7" stroke="#dfac56" stroke-width="2"/><text x="710.0" y="157" font-size="26" fill="#23464a" text-anchor="middle" font-weight="650">KV 交接</text><text x="710.0" y="193" font-size="21" fill="#607b71" text-anchor="middle" font-weight="400">网络 + 协议</text><text x="710.0" y="224" font-size="21" fill="#607b71" text-anchor="middle" font-weight="400">必要时重排</text><path d="M817 178 L870 178" stroke="#2c756b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="883" y="118" width="185" height="126" rx="14" fill="#e2eee5" stroke="#9bbbac" stroke-width="2"/><text x="975.5" y="157" font-size="26" fill="#23464a" text-anchor="middle" font-weight="650">D Worker</text><text x="975.5" y="193" font-size="21" fill="#607b71" text-anchor="middle" font-weight="400">持续生成</text><text x="975.5" y="224" font-size="21" fill="#607b71" text-anchor="middle" font-weight="400">满足 ITL</text><text x="550" y="313" font-size="25" fill="#23464a" text-anchor="middle" font-weight="400">省下的阶段干扰，需要覆盖传输和额外排队成本。</text><text x="38" y="391" font-size="20" fill="#71887a" text-anchor="start" font-weight="400">图为一种简化路径；实际系统可流水传输、缓存命中或采用不同并行度。</text></g></svg>