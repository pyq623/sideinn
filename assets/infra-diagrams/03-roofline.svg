<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc"><title id="title">先判断瓶颈 / 不只看 GPU 利用率</title><desc id="desc">Roofline 是理想下界；峰值规格不能直接代替实测有效算力或带宽。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2c756b"/></marker></defs><rect width="1100" height="420" rx="10" fill="#fffdf5"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="38" y="49" font-size="28" fill="#23464a" text-anchor="start" font-weight="650">先判断瓶颈 / 不只看 GPU 利用率</text><rect x="40" y="110" width="475" height="145" rx="14" fill="#e2eee5" stroke="#9bbbac" stroke-width="2"/><text x="277.5" y="149" font-size="26" fill="#23464a" text-anchor="middle" font-weight="650">计算时间下界</text><text x="277.5" y="185" font-size="21" fill="#607b71" text-anchor="middle" font-weight="400">FLOP 数 F ÷ 有效算力 Φ</text><text x="277.5" y="216" font-size="21" fill="#607b71" text-anchor="middle" font-weight="400">大矩阵、足够并行度</text><rect x="585" y="110" width="475" height="145" rx="14" fill="#f9e7b7" stroke="#dfac56" stroke-width="2"/><text x="822.5" y="149" font-size="26" fill="#23464a" text-anchor="middle" font-weight="650">搬运时间下界</text><text x="822.5" y="185" font-size="21" fill="#607b71" text-anchor="middle" font-weight="400">字节数 D ÷ 有效带宽 β</text><text x="822.5" y="216" font-size="21" fill="#607b71" text-anchor="middle" font-weight="400">权重读取、KV 读取</text><text x="550" y="196" font-size="26" fill="#23464a" text-anchor="middle" font-weight="650">max</text><text x="550" y="320" font-size="26" fill="#23464a" text-anchor="middle" font-weight="400">总时间还要计入启动、同步、通信与调度开销。</text><text x="38" y="391" font-size="20" fill="#71887a" text-anchor="start" font-weight="400">Roofline 是理想下界；峰值规格不能直接代替实测有效算力或带宽。</text></g></svg>