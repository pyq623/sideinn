<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc"><title id="title">投机解码 / 用额外工作减少串行轮次</title><desc id="desc">经典随机算法需接受/拒绝修正规则；树、贪心与块式方案按各自算法验证。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2c756b"/></marker></defs><rect width="1100" height="420" rx="10" fill="#fffdf5"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="38" y="49" font-size="28" fill="#23464a" text-anchor="start" font-weight="650">投机解码 / 用额外工作减少串行轮次</text><rect x="38" y="100" width="240" height="130" rx="14" fill="#e2eee5" stroke="#9bbbac" stroke-width="2"/><text x="158.0" y="139" font-size="26" fill="#23464a" text-anchor="middle" font-weight="650">1. 草稿提出</text><text x="158.0" y="175" font-size="21" fill="#607b71" text-anchor="middle" font-weight="400">猜 K 个 token</text><text x="158.0" y="206" font-size="21" fill="#607b71" text-anchor="middle" font-weight="400">便宜或并行的草稿</text><path d="M286 165 L356 165" stroke="#2c756b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="368" y="100" width="350" height="130" rx="14" fill="#f9e7b7" stroke="#dfac56" stroke-width="2"/><text x="543.0" y="139" font-size="26" fill="#23464a" text-anchor="middle" font-weight="650">2. 目标模型验证</text><text x="543.0" y="175" font-size="21" fill="#607b71" text-anchor="middle" font-weight="400">并行计算条件分布</text><text x="543.0" y="206" font-size="21" fill="#607b71" text-anchor="middle" font-weight="400">不是直接相信草稿</text><path d="M725 165 L795 165" stroke="#2c756b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="807" y="100" width="255" height="130" rx="14" fill="#e2eee5" stroke="#9bbbac" stroke-width="2"/><text x="934.5" y="139" font-size="26" fill="#23464a" text-anchor="middle" font-weight="650">3. 提交输出</text><text x="934.5" y="175" font-size="21" fill="#607b71" text-anchor="middle" font-weight="400">接受连续前缀</text><text x="934.5" y="206" font-size="21" fill="#607b71" text-anchor="middle" font-weight="400">首次拒绝处修正</text><text x="550" y="300" font-size="25" fill="#23464a" text-anchor="middle" font-weight="400">总收益 = 每轮有效输出 ÷（草稿 + 验证 + 维护时间）</text><text x="38" y="391" font-size="20" fill="#71887a" text-anchor="start" font-weight="400">经典随机算法需接受/拒绝修正规则；树、贪心与块式方案按各自算法验证。</text></g></svg>