<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc"><title id="title">同一个模型 / 两种工作负载</title><desc id="desc">普通自回归解码的简化流程；分块 prefill 与投机验证会改变每轮 Query 数。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2c756b"/></marker></defs><rect width="1100" height="420" rx="10" fill="#fffdf5"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="38" y="49" font-size="28" fill="#23464a" text-anchor="start" font-weight="650">同一个模型 / 两种工作负载</text><rect x="38" y="100" width="255" height="130" rx="14" fill="#e2eee5" stroke="#9bbbac" stroke-width="2"/><text x="165.5" y="139" font-size="26" fill="#23464a" text-anchor="middle" font-weight="650">Prefill</text><text x="165.5" y="175" font-size="21" fill="#607b71" text-anchor="middle" font-weight="400">已知输入：多 Query</text><text x="165.5" y="206" font-size="21" fill="#607b71" text-anchor="middle" font-weight="400">并行构建输入 KV</text><path d="M300 165 L385 165" stroke="#2c756b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="395" y="100" width="285" height="130" rx="14" fill="#f9e7b7" stroke="#dfac56" stroke-width="2"/><text x="537.5" y="139" font-size="26" fill="#23464a" text-anchor="middle" font-weight="650">历史 KV</text><text x="537.5" y="175" font-size="21" fill="#607b71" text-anchor="middle" font-weight="400">每层保存 Key / Value</text><text x="537.5" y="206" font-size="21" fill="#607b71" text-anchor="middle" font-weight="400">以后反复读取</text><path d="M687 165 L773 165" stroke="#2c756b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="785" y="100" width="275" height="130" rx="14" fill="#e2eee5" stroke="#9bbbac" stroke-width="2"/><text x="922.5" y="139" font-size="26" fill="#23464a" text-anchor="middle" font-weight="650">Decode</text><text x="922.5" y="175" font-size="21" fill="#607b71" text-anchor="middle" font-weight="400">新 token：单 Query</text><text x="922.5" y="206" font-size="21" fill="#607b71" text-anchor="middle" font-weight="400">读取 KV → 下个 token</text><path d="M920 240 L920 295" stroke="#2c756b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="905" y="327" font-size="24" fill="#23464a" text-anchor="middle" font-weight="400">逐步循环</text><text x="40" y="312" font-size="25" fill="#23464a" text-anchor="start" font-weight="400">缓存省掉过去的投影，不能省掉新 Query 对历史的注意力。</text><text x="38" y="391" font-size="20" fill="#71887a" text-anchor="start" font-weight="400">普通自回归解码的简化流程；分块 prefill 与投机验证会改变每轮 Query 数。</text></g></svg>