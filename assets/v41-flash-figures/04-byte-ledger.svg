<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" role="img" aria-labelledby="title desc">
<title id="title">04  从 FP4 位宽算到 890 B / token</title><desc id="desc">按论文最终 global KV 格式计算；包括分组 scale，不包括 SWA。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#61716a"/></marker></defs>
<rect width="1000" height="790" rx="22" fill="#faf8f2"/>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="40" y="50" font-size="29" fill="#203b35" font-weight="650" text-anchor="start">04  从 FP4 位宽算到 890 B / token</text>
<text x="40" y="86" font-size="18" fill="#61716a" font-weight="400" text-anchor="start">按论文最终 global KV 格式计算；包括分组 scale，不包括 SWA。</text>
<rect x="40" y="130" width="440" height="160" rx="14" fill="#e5f1eb" stroke="#cfdbd2"/>
<text x="60" y="166" font-size="23" fill="#22786b" font-weight="650" text-anchor="start">Main KV · 512 维</text>
<text x="60" y="203" font-size="20" fill="#203b35" font-weight="400" text-anchor="start">数据：512 × 4 / 8 = 256 B</text>
<text x="60" y="234" font-size="20" fill="#203b35" font-weight="400" text-anchor="start">Scale：512 / 16 × 1 = 32 B</text>
<text x="60" y="265" font-size="20" fill="#203b35" font-weight="400" text-anchor="start">合计：288 B / 条</text>
<rect x="520" y="130" width="440" height="160" rx="14" fill="#e5f1eb" stroke="#cfdbd2"/>
<text x="540" y="166" font-size="23" fill="#22786b" font-weight="650" text-anchor="start">Indexer K · 128 维</text>
<text x="540" y="203" font-size="20" fill="#203b35" font-weight="400" text-anchor="start">数据：128 × 4 / 8 = 64 B</text>
<text x="540" y="234" font-size="20" fill="#203b35" font-weight="400" text-anchor="start">Scale：128 / 32 × 1 = 4 B</text>
<text x="540" y="265" font-size="20" fill="#203b35" font-weight="400" text-anchor="start">合计：68 B / 条</text>
<polyline points="260,290 260,325 500,325 500,355" fill="none" stroke="#61716a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="740,290 740,325 500,325" fill="none" stroke="#61716a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="235" y="360" width="530" height="94" rx="14" fill="#e5f1eb" stroke="#cfdbd2"/>
<text x="255" y="396" font-size="23" fill="#22786b" font-weight="650" text-anchor="start">一个 global 条目：288 + 68 = 356 B</text>
<polyline points="500,454 500,490" fill="none" stroke="#61716a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="495" width="920" height="122" rx="14" fill="#e5f1eb" stroke="#cfdbd2"/>
<text x="60" y="531" font-size="23" fill="#22786b" font-weight="650" text-anchor="start">每个原始 token 对应多少 global 条目？</text>
<text x="60" y="568" font-size="20" fill="#203b35" font-weight="400" text-anchor="start">Encoder：3 套 × 1/2 ；Decoder：1 套 × 1 → 合计 2.5 条 / token</text>
<text x="500" y="671" font-size="32" fill="#22786b" font-weight="700" text-anchor="middle">356 × 2.5 = 890 B / 原始 token</text>
<text x="500" y="714" font-size="19" fill="#61716a" font-weight="400" text-anchor="middle">不含权重、Engram、SWA、索引地址、分配碎片和运行工作区。</text>
<text x="40" y="767" font-size="15" fill="#61716a" font-weight="400" text-anchor="start">支线客栈 · 原创教学示意 · 依据技术报告 v1，2026-09-17</text>
</g></svg>