<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">Bounded replay：存长期内容，补短期状态</title><desc id="desc">只重放有限后缀；不是与完整历史计算严格等价。固定重放长度限制历史开销；重放段仍需通过相应模型层。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#316a62"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="800" height="500" rx="0" fill="#faf7f0" stroke="none" stroke-width="1.5"/><text x="30" y="43" font-size="28" fill="#352f2a" font-weight="650" text-anchor="start">Bounded replay：存长期内容，补短期状态</text><text x="30" y="76" font-size="18" fill="#74695e" font-weight="400" text-anchor="start">只重放有限后缀；不是与完整历史计算严格等价</text><text x="30" y="122" font-size="21" fill="#352f2a" font-weight="600" text-anchor="start">历史 token</text><rect x="170" y="97" width="400" height="45" rx="10" fill="#e9e5dc" stroke="none" stroke-width="1.5"/><rect x="576" y="97" width="194" height="45" rx="10" fill="#f2dfcb" stroke="none" stroke-width="1.5"/><text x="370" y="128" font-size="22" fill="#74695e" font-weight="400" text-anchor="middle">已缓存前缀</text><text x="673" y="128" font-size="22" fill="#b96837" font-weight="600" text-anchor="middle">重放后缀</text><text x="30" y="211" font-size="21" fill="#352f2a" font-weight="600" text-anchor="start">global KV</text><rect x="170" y="172" width="600" height="62" rx="10" fill="#dcebe3" stroke="none" stroke-width="1.5"/><text x="470" y="212" font-size="23" fill="#316a62" font-weight="500" text-anchor="middle">直接复用已有的全局内容</text><text x="30" y="306" font-size="21" fill="#352f2a" font-weight="600" text-anchor="start">局部 SWA</text><rect x="170" y="269" width="400" height="66" rx="10" fill="#e9e5dc" stroke="none" stroke-width="1.5"/><text x="370" y="311" font-size="22" fill="#74695e" font-weight="400" text-anchor="middle">旧局部状态已缺失</text><rect x="576" y="269" width="194" height="66" rx="10" fill="#f2dfcb" stroke="none" stroke-width="1.5"/><text x="673" y="311" font-size="23" fill="#b96837" font-weight="550" text-anchor="middle">重新计算</text><path d="M576 238 L576 257" fill="none" stroke="#b96837" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="576" y="367" font-size="22" fill="#b96837" font-weight="600" text-anchor="start">↑ 重放起点 s</text><text x="30" y="410" font-size="25" fill="#352f2a" font-weight="550" text-anchor="start">开头看不到段外历史 → 多层状态是近似恢复</text><text x="30" y="475" font-size="17" fill="#74695e" font-weight="400" text-anchor="start">固定重放长度限制历史开销；重放段仍需通过相应模型层。</text></g></svg>
