<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">异步调度：把 CPU 工作藏进设备执行</title><desc id="desc">C：CPU 调度；G：设备计算与采样 · 教学耗时。下排省略填充与排空；依赖、回退及资源释放仍须正确同步。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#316a62"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="800" height="500" rx="0" fill="#faf7f0" stroke="none" stroke-width="1.5"/><text x="30" y="43" font-size="28" fill="#352f2a" font-weight="650" text-anchor="start">异步调度：把 CPU 工作藏进设备执行</text><text x="30" y="76" font-size="18" fill="#74695e" font-weight="400" text-anchor="start">C：CPU 调度；G：设备计算与采样 · 教学耗时</text><text x="30" y="120" font-size="23" fill="#352f2a" font-weight="650" text-anchor="start">串行</text><text x="155" y="120" font-size="22" fill="#352f2a" font-weight="500" text-anchor="start">一轮 10 ms = CPU 2 ms + 设备 8 ms</text><rect x="160" y="146" width="60" height="60" rx="10" fill="#f2dfcb" stroke="none" stroke-width="1.5"/><text x="190" y="183" font-size="22" fill="#b96837" font-weight="600" text-anchor="middle">C1</text><rect x="220" y="146" width="240" height="60" rx="10" fill="#dcebe3" stroke="none" stroke-width="1.5"/><text x="340" y="183" font-size="22" fill="#316a62" font-weight="600" text-anchor="middle">G1 · 8 ms</text><rect x="460" y="146" width="60" height="60" rx="10" fill="#f2dfcb" stroke="none" stroke-width="1.5"/><text x="490" y="183" font-size="22" fill="#b96837" font-weight="600" text-anchor="middle">C2</text><rect x="520" y="146" width="240" height="60" rx="10" fill="#dcebe3" stroke="none" stroke-width="1.5"/><text x="640" y="183" font-size="22" fill="#316a62" font-weight="600" text-anchor="middle">G2 · 8 ms</text><text x="30" y="261" font-size="23" fill="#352f2a" font-weight="650" text-anchor="start">理想重叠</text><text x="195" y="261" font-size="22" fill="#352f2a" font-weight="500" text-anchor="start">稳态每 8 ms 推进一轮</text><text x="30" y="316" font-size="22" fill="#b96837" font-weight="600" text-anchor="start">CPU</text><text x="30" y="389" font-size="22" fill="#316a62" font-weight="600" text-anchor="start">设备</text><rect x="160" y="282" width="60" height="54" rx="10" fill="#f2dfcb" stroke="none" stroke-width="1.5"/><text x="190" y="317" font-size="20" fill="#b96837" font-weight="600" text-anchor="middle">C2</text><rect x="160" y="354" width="240" height="54" rx="10" fill="#dcebe3" stroke="none" stroke-width="1.5"/><text x="280" y="390" font-size="22" fill="#316a62" font-weight="600" text-anchor="middle">G1 · 8 ms</text><rect x="400" y="282" width="60" height="54" rx="10" fill="#f2dfcb" stroke="none" stroke-width="1.5"/><text x="430" y="317" font-size="20" fill="#b96837" font-weight="600" text-anchor="middle">C3</text><rect x="400" y="354" width="240" height="54" rx="10" fill="#dcebe3" stroke="none" stroke-width="1.5"/><text x="520" y="390" font-size="22" fill="#316a62" font-weight="600" text-anchor="middle">G2 · 8 ms</text><rect x="640" y="354" width="120" height="54" rx="10" fill="#dcebe3" stroke="none" stroke-width="1.5"/><text x="700" y="390" font-size="22" fill="#316a62" font-weight="600" text-anchor="middle">G3…</text><rect x="640" y="282" width="60" height="54" rx="10" fill="#f2dfcb" stroke="none" stroke-width="1.5"/><text x="670" y="317" font-size="20" fill="#b96837" font-weight="600" text-anchor="middle">C4</text><text x="30" y="475" font-size="17" fill="#74695e" font-weight="400" text-anchor="start">下排省略填充与排空；依赖、回退及资源释放仍须正确同步。</text></g></svg>
