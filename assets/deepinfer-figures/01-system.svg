<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">一条请求，三个层次</title><desc id="desc">逻辑数据流示意 · 缓存与路由依赖线上服务配套。绿色：公开引擎与配套组件；橙色：未完整开源的生产服务。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#316a62"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="800" height="500" rx="0" fill="#faf7f0" stroke="none" stroke-width="1.5"/><text x="30" y="43" font-size="28" fill="#352f2a" font-weight="650" text-anchor="start">一条请求，三个层次</text><text x="30" y="76" font-size="18" fill="#74695e" font-weight="400" text-anchor="start">逻辑数据流示意 · 缓存与路由依赖线上服务配套</text><rect x="30" y="107" width="190" height="80" rx="10" fill="#dcebe3" stroke="none" stroke-width="1.5"/><text x="125.0" y="142" font-size="24" fill="#352f2a" font-weight="600" text-anchor="middle">API 消息</text><text x="125.0" y="172" font-size="18" fill="#74695e" font-weight="400" text-anchor="middle">recipe 编码 / 解析</text><path d="M220 147 L270 147" fill="none" stroke="#316a62" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="275" y="107" width="220" height="80" rx="10" fill="#f2dfcb" stroke="none" stroke-width="1.5"/><text x="385.0" y="142" font-size="24" fill="#352f2a" font-weight="600" text-anchor="middle">缓存查询与路由</text><text x="385.0" y="172" font-size="18" fill="#74695e" font-weight="400" text-anchor="middle">共享 KV · 工作量估计</text><path d="M495 147 L545 147" fill="none" stroke="#316a62" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="550" y="107" width="220" height="80" rx="10" fill="#f2dfcb" stroke="none" stroke-width="1.5"/><text x="660.0" y="142" font-size="24" fill="#352f2a" font-weight="600" text-anchor="middle">VE → P → D</text><text x="660.0" y="172" font-size="18" fill="#74695e" font-weight="400" text-anchor="middle">按阶段分配资源</text><text x="30" y="222" font-size="20" fill="#316a62" font-weight="650" text-anchor="start">引擎内的协同优化</text><rect x="30" y="239" width="740" height="178" rx="10" fill="#edf1e8" stroke="#316a62" stroke-width="1.5"/><rect x="48" y="258" width="214" height="95" rx="10" fill="#dcebe3" stroke="none" stroke-width="1.5"/><text x="155.0" y="293" font-size="24" fill="#352f2a" font-weight="600" text-anchor="middle">模型与 KV</text><text x="155.0" y="323" font-size="18" fill="#74695e" font-weight="400" text-anchor="middle">CED / CSA2 / SWA</text><rect x="292" y="258" width="214" height="95" rx="10" fill="#dcebe3" stroke="none" stroke-width="1.5"/><text x="399.0" y="293" font-size="24" fill="#352f2a" font-weight="600" text-anchor="middle">草稿与验证</text><text x="399.0" y="323" font-size="18" fill="#74695e" font-weight="400" text-anchor="middle">DSpark / 长度调度</text><rect x="536" y="258" width="214" height="95" rx="10" fill="#dcebe3" stroke="none" stroke-width="1.5"/><text x="643.0" y="293" font-size="24" fill="#352f2a" font-weight="600" text-anchor="middle">专家与算子</text><text x="643.0" y="323" font-size="18" fill="#74695e" font-weight="400" text-anchor="middle">EP / EPLB / 融合</text><text x="400" y="393" font-size="21" fill="#316a62" font-weight="500" text-anchor="middle">CPU 排批与设备执行重叠，采样后进入下一轮</text><path d="M660 190 L660 237" fill="none" stroke="#316a62" stroke-width="2.5" marker-end="url(#arrow)"/><text x="30" y="475" font-size="17" fill="#74695e" font-weight="400" text-anchor="start">绿色：公开引擎与配套组件；橙色：未完整开源的生产服务。</text></g></svg>
