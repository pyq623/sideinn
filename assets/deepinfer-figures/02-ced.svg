<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">CED：长历史少跑后半层</title><desc id="desc">global KV 可提前构造；局部 SWA 仍需短后缀重放。教学工作量：N×L/2 + W×L/2；端到端收益还受通信与算子影响。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#316a62"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="800" height="500" rx="0" fill="#faf7f0" stroke="none" stroke-width="1.5"/><text x="30" y="43" font-size="28" fill="#352f2a" font-weight="650" text-anchor="start">CED：长历史少跑后半层</text><text x="30" y="76" font-size="18" fill="#74695e" font-weight="400" text-anchor="start">global KV 可提前构造；局部 SWA 仍需短后缀重放</text><text x="30" y="124" font-size="20" fill="#316a62" font-weight="650" text-anchor="start">PREFILL</text><rect x="30" y="145" width="210" height="85" rx="10" fill="#dcebe3" stroke="none" stroke-width="1.5"/><text x="135.0" y="180" font-size="24" fill="#352f2a" font-weight="600" text-anchor="middle">完整 prompt</text><text x="135.0" y="210" font-size="18" fill="#74695e" font-weight="400" text-anchor="middle">N 个 token</text><path d="M240 188 L285 188" fill="none" stroke="#316a62" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="290" y="145" width="220" height="85" rx="10" fill="#dcebe3" stroke="none" stroke-width="1.5"/><text x="400.0" y="180" font-size="24" fill="#352f2a" font-weight="600" text-anchor="middle">前半层 encoder</text><text x="400.0" y="210" font-size="18" fill="#74695e" font-weight="400" text-anchor="middle">完整处理 N 个 token</text><path d="M510 188 L555 188" fill="none" stroke="#316a62" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="560" y="145" width="210" height="85" rx="10" fill="#dcebe3" stroke="none" stroke-width="1.5"/><text x="665.0" y="180" font-size="24" fill="#352f2a" font-weight="600" text-anchor="middle">global KV</text><text x="665.0" y="210" font-size="18" fill="#74695e" font-weight="400" text-anchor="middle">由末层表示投影</text><path d="M400 234 L400 270" fill="none" stroke="#316a62" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="290" y="275" width="220" height="85" rx="10" fill="#f2dfcb" stroke="none" stroke-width="1.5"/><text x="400.0" y="310" font-size="24" fill="#352f2a" font-weight="600" text-anchor="middle">后半层 decoder</text><text x="400.0" y="340" font-size="18" fill="#74695e" font-weight="400" text-anchor="middle">短后缀 W 个 token</text><text x="540" y="310" font-size="23" fill="#b96837" font-weight="550" text-anchor="start">准备局部 SWA</text><text x="540" y="341" font-size="18" fill="#74695e" font-weight="400" text-anchor="start">不会把后半模型删掉</text><text x="30" y="399" font-size="20" fill="#316a62" font-weight="650" text-anchor="start">DECODE</text><rect x="177" y="373" width="593" height="58" rx="10" fill="#dcebe3" stroke="none" stroke-width="1.5"/><text x="474" y="410" font-size="22" fill="#352f2a" font-weight="500" text-anchor="middle">新 token → encoder → decoder → 采样</text><text x="30" y="475" font-size="17" fill="#74695e" font-weight="400" text-anchor="start">教学工作量：N×L/2 + W×L/2；端到端收益还受通信与算子影响。</text></g></svg>
