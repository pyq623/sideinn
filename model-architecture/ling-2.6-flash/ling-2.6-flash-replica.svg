.5"/><text x="310.0" y="1272.0" font-size="14" font-weight="400" text-anchor="middle" style="fill:#30373d">Tokenized text</text><path d="M310 1250 L310 1179" class="wire" style="stroke:#30373d" marker-end="url(#ling-2.6-flash-replica-arrow)"/><rect x="625" y="140" width="700" height="400" rx="14" fill="#fffcf5" stroke="#cbbb92" stroke-width="1.5"/><text x="649" y="172" font-size="20" font-weight="600" text-anchor="start" style="fill:#866722">MoE · 256 个路由专家 + 1 个共享专家</text><circle cx="975.0" cy="216" r="11" fill="white" stroke="#30373d" stroke-width="1.5"/><text x="975.0" y="221" font-size="18" font-weight="400" text-anchor="middle" style="fill:#30373d">+</text><path d="M975.0 205 L975.0 188" class="wire" style="stroke:#30373d" marker-end="url(#ling-2.6-flash-replica-arrow)"/><rect x="657" y="282" width="170" height="56" rx="7" fill="#e3eee7" stroke="#a5a9ac" stroke-width="1.5"/><text x="742.0" y="306.0" font-size="14" font-weight="400" text-anchor="middle" style="fill:#30373d">Shared expert</text><text x="742.0" y="324.0" font-size="14" font-weight="400" text-anchor="middle" style="fill:#30373d">SwiGLU</text><rect x="895" y="282" width="398" height="56" rx="7" fill="#fff0cc" stroke="#a5a9ac" stroke-width="1.5"/><text x="1094.0" y="306.0" font-size="14" font-weight="400" text-anchor="middle" style="fill:#30373d">Top-8 routed experts · SwiGLU</text><text x="1094.0" y="324.0" font-size="14" font-weight="400" text-anchor="middle" style="fill:#30373d">对选中专家的输出加权求和</text><path d="M742 282 V216 H964.0" class="wire" style="stroke:#30373d" marker-end="url(#ling-2.6-flash-replica-arrow)"/><path d="M1155 282 V216 H986.0" class="wire" style="stroke:#30373d" marker-end="url(#ling-2.6-flash-replica-arrow)"/><rect x="657" y="417" width="220" height="34" rx="7" fill="#fafaf8" stroke="#a5a9ac" stroke-width="1.5"/><text x="767.0" y="439.0" font-size="13" font-weight="400" text-anchor="middle" style="fill:#30373d">输入：RMSNorm 的输出</text><path d="M742 417 L742 338" class="wire" style="stroke:#30373d" marker-end="url(#ling-2.6-flash-replica-arrow)"/><path d="M877 434 H903 V365 H1155 V338" class="wire" style="stroke:#30373d" marker-end="url(#ling-2.6-flash-replica-arrow)"/><rect x="955" y="405" width="338" height="62" rx="7" fill="#dfedf6" stroke="#a5a9ac" stroke-width="1.5"/><text x="1124.0" y="432.0" font-size="14" font-weight="400" text-anchor="middle" style="fill:#30373d">Router → sigmoid</text><text x="1124.0" y="450.0" font-size="14" font-weight="400" text-anchor="middle" style="fill:#30373d">分组选择 → Top-8</text><path d="M877 434 L955 434" class="wire" style="stroke:#30373d" marker-end="url(#ling-2.6-flash-replica-arrow)"/><path d="M1200 405 V350 H1185 V338" class="wire" style="stroke:#30373d" marker-end="url(#ling-2.6-flash-replica-arrow)" stroke-dasharray="4 4"/><text x="649" y="490" font-size="13" font-weight="400" text-anchor="start" style="fill:#647985">实线传递特征；虚线传递选择与权重。共享专家处理每个 token。</text><text x="649" y="514" font-size="13" font-weight="400" text-anchor="start" style="fill:#647985">Bias 只参与选择；原始 sigmoid 分数归一化后乘 2.5 作为路由权重。</text><rect x="625" y="570" width="700" height="585" rx="14" fill="#f5f9fb" stroke="#a6bdca" stroke-width="1.5"/><text x="649" y="603" font-size="20" font-weight="600" text-anchor="start" style="fill:#286d8c">Lightning Attention · 内部数据流</text><rect x="777" y="638" width="256" height="34" rx="7" fill="white" stroke="#a5a9ac" stroke-width="1.5"/><text x="905.0" y="660.0" font-size="14" font-weight="400" text-anchor="middle" style="fill:#30373d">Output projection</text><rect x="777" y="745" width="256" height="34" rx="7" fill="white" stroke="#a5a9ac" stroke-width="1.5"/><text x="905.0" y="767.0" font-size="14" font-weight="400" text-anchor="middle" style="fill:#30373d">Group RMSNorm</text><rect x="777" y="812" width="256" height="34" rx="7" fill="#dfedf6" stroke="#a5a9ac" stroke-width="1.5"/><text x="905.0" y="834.0" font-size="14" font-weight="400" text-anchor="middle" style="fill:#30373d">Lightning Attention kernel</t