ojection</text><rect x="1151" y="895" width="132" height="34" rx="7" fill="#fafaf8" stroke="#a5a9ac" stroke-width="1.5"/><text x="1217.0" y="917.0" font-size="14" font-weight="400" text-anchor="middle" style="fill:#30373d">sigmoid</text><path d="M1217 1024 L1217 929" class="wire" style="stroke:#30373d" marker-end="url(#ling-2.6-flash-replica-arrow)"/><path d="M1217 895 V707 H916" class="wire" style="stroke:#30373d" marker-end="url(#ling-2.6-flash-replica-arrow)"/><path d="M905 1105 V1082 H1217 V1058" class="wire" style="stroke:#30373d" marker-end="url(#ling-2.6-flash-replica-arrow)"/><path d="M905 1082 L905 1058" class="wire" style="stroke:#30373d" marker-end="url(#ling-2.6-flash-replica-arrow)"/><text x="905" y="1127" font-size="13" font-weight="400" text-anchor="middle" style="fill:#647985">输入：层内第一个 RMSNorm 的输出</text><text x="647" y="653" font-size="12" font-weight="400" text-anchor="start" style="fill:#647985">32 个头</text><text x="647" y="676" font-size="12" font-weight="400" text-anchor="start" style="fill:#647985">每头 128 维</text><text x="625" y="1195" font-size="15" font-weight="400" text-anchor="start" style="fill:#647985">32 层 = 28 层 Lightning Attention + 4 层 MLA</text><text x="625" y="1221" font-size="15" font-weight="400" text-anchor="start" style="fill:#647985">第 1 层的 FFN 使用 Dense SwiGLU；其余 31 层使用 MoE。</text><text x="625" y="1247" font-size="15" font-weight="400" text-anchor="start" style="fill:#647985">图形构图参考官方 1T 图，层数与参数均按 Flash 配置改写。</text><text x="625" y="1273" font-size="15" font-weight="400" text-anchor="start" style="fill:#647985">此图为资料重绘，并非官方发布的 Flash 原图。</text><text x="48" y="1320" font-size="13" font-weight="400" text-anchor="start" style="fill:#647985">仅绘制 32 层 Decoder 主干；不展开辅助 MTP。×N 表示结构重复，各层参数独立。</text></svg>